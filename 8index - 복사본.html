<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>하트의 계이름 오페라</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #140d1b;
    font-family:
        "Arial Rounded MT Bold",
        "Malgun Gothic",
        sans-serif;

    color: #fff;
}

button {
    font-family: inherit;
}


/* =========================================
   전체
========================================= */

#app {

    width: min(1150px, 100%);
    min-height: 100vh;

    margin: auto;

    background: #24172c;

    overflow: hidden;

    box-shadow:
        0 0 80px rgba(0,0,0,.65);
}


/* =========================================
   상단
========================================= */

.header {

    height: 80px;

    padding:
        10px 24px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        linear-gradient(
            #39213f,
            #21142a
        );

    border-bottom:
        4px solid #c89a56;
}

.title {

    color: #ffda83;

    font-size:
        clamp(25px, 4vw, 42px);

    font-weight: 900;

    letter-spacing: -2px;

    text-shadow:
        2px 3px 0 #704354;
}

.score-box {

    padding:
        8px 17px;

    border:
        3px solid #dda85e;

    border-radius:
        18px;

    background:
        #fff8e9;

    color:
        #5b3d38;

    font-size:
        16px;

    font-weight:
        900;

    box-shadow:
        0 5px 0 #95663e;
}

#score {

    color:
        #d94f6e;

    font-size:
        27px;
}


/* =========================================
   문제 영역
========================================= */

.question-box {

    padding:
        12px 15px 17px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #fffdf6,
            #f6e4cf
        );

    text-align:
        center;

    border-bottom:
        5px solid #95633e;
}

.instruction {

    color:
        #896256;

    font-size:
        16px;

    font-weight:
        900;
}

.question-title {

    margin:
        3px 0 0;

    color:
        #5b3738;

    font-size:
        clamp(23px, 4vw, 34px);

    font-weight:
        900;
}

.question-title span {

    color:
        #db5572;
}


/* =========================================
   오선
========================================= */

.quiz-staff {

    width:
        min(850px, 100%);

    height:
        170px;

    display:
        block;

    margin:
        0 auto;
}

.staff-line {

    stroke:
        #302727;

    stroke-width:
        3;
}

.clef {

    font-family:
        "Times New Roman",
        serif;

    font-size:
        106px;

    fill:
        #2c2424;
}


/* 음표 머리 */

.quiz-note {

    fill:
        #fffaf0;

    stroke:
        #201c1c;

    stroke-width:
        3.5;
}


/* 도의 덧줄 */

.quiz-ledger {

    stroke:
        #201c1c;

    stroke-width:
        3;

    stroke-linecap:
        round;
}


/* =========================================
   보기
========================================= */

.answers {

    width:
        min(760px, 100%);

    margin:
        0 auto;

    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        12px;
}

.answer {

    padding:
        12px 5px;

    border:
        3px solid #d88967;

    border-radius:
        17px;

    background:
        linear-gradient(
            #ffe8d5,
            #ffd0c2
        );

    color:
        #593437;

    font-size:
        clamp(18px, 3vw, 26px);

    font-weight:
        900;

    cursor:
        pointer;

    box-shadow:
        0 5px 0 #a96354;

    transition:
        transform .1s;
}

.answer:hover {

    transform:
        translateY(-2px);
}

.answer:active {

    transform:
        translateY(4px);

    box-shadow:
        0 2px 0 #a96354;
}

.answer.correct {

    background:
        #c9f1d0;

    border-color:
        #70ad7b;

    box-shadow:
        0 5px 0 #4e895d;
}

.answer.wrong {

    background:
        #ffafb9;

    border-color:
        #cd596c;

    box-shadow:
        0 5px 0 #a94357;
}


/* =========================================
   오페라 극장
========================================= */

.world {

    position:
        relative;

    height:
        390px;

    overflow:
        hidden;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            #66365f 0%,
            #2c1833 43%,
            #120b17 100%
        );
}


/* 조명 */

.spotlight {

    position:
        absolute;

    top:
        -40px;

    width:
        250px;

    height:
        430px;

    opacity:
        .24;

    background:
        linear-gradient(
            180deg,
            rgba(255,241,194,.8),
            rgba(255,241,194,0)
        );

    clip-path:
        polygon(
            38% 0,
            62% 0,
            100% 100%,
            0 100%
        );
}

.spotlight.left {

    left:
        4%;

    transform:
        rotate(-13deg);
}

.spotlight.center {

    left:
        38%;

    width:
        290px;

    opacity:
        .32;
}

.spotlight.right {

    right:
        4%;

    transform:
        rotate(13deg);
}


/* 무대 아치 */

.arch {

    position:
        absolute;

    left:
        4%;

    right:
        4%;

    top:
        -90px;

    height:
        170px;

    border:
        10px solid #c3914e;

    border-radius:
        50% 50% 0 0;

    box-shadow:
        inset 0 0 0 6px #6e452e,
        0 0 20px rgba(255,200,100,.18);
}


/* =========================================
   커튼
========================================= */

.curtain {

    position:
        absolute;

    top:
        0;

    width:
        18%;

    height:
        275px;

    background:
        linear-gradient(
            90deg,
            #5c1b2f,
            #a63c4d 35%,
            #681d31 70%,
            #3d1426
        );

    z-index:
        5;

    box-shadow:
        inset -15px 0 18px rgba(0,0,0,.35);
}

.curtain.left {

    left:
        0;

    clip-path:
        polygon(
            0 0,
            100% 0,
            83% 35%,
            100% 100%,
            0 84%
        );
}

.curtain.right {

    right:
        0;

    transform:
        scaleX(-1);
}

.curtain-fold {

    position:
        absolute;

    top:
        0;

    width:
        10px;

    height:
        240px;

    background:
        rgba(255,210,190,.1);

    border-radius:
        50%;
}

.curtain-fold.f1 {
    left: 30%;
}

.curtain-fold.f2 {
    left: 50%;
}

.curtain-fold.f3 {
    left: 70%;
}


/* =========================================
   무대 바닥
========================================= */

.stage-floor {

    position:
        absolute;

    left:
        0;

    right:
        0;

    bottom:
        80px;

    height:
        55px;

    background:
        linear-gradient(
            #c99a55,
            #805d39
        );

    border-top:
        6px solid #e4bb73;

    z-index:
        8;
}


/* =========================================
   객석
========================================= */

.seat-area {

    position:
        absolute;

    left:
        0;

    right:
        0;

    bottom:
        0;

    height:
        105px;

    background:
        linear-gradient(
            #321928,
            #180d16
        );

    z-index:
        2;
}

.seats {

    position:
        absolute;

    left:
        8%;

    right:
        8%;

    bottom:
        18px;

    height:
        62px;

    display:
        flex;

    justify-content:
        space-around;

    align-items:
        end;
}

.seat {

    width:
        48px;

    height:
        48px;

    background:
        linear-gradient(
            #7e3445,
            #481a2a
        );

    border-radius:
        18px 18px 7px 7px;

    border:
        2px solid #a65a5f;

    box-shadow:
        0 5px 0 #24121b;
}


/* =========================================
   귀여운 하트
========================================= */

.heart-runner {

    position:
        absolute;

    left:
        10%;

    bottom:
        110px;

    width:
        135px;

    height:
        150px;

    z-index:
        25;
}

.heart-svg {

    position:
        absolute;

    left:
        12px;

    top:
        39px;

    width:
        110px;

    height:
        105px;

    overflow:
        visible;

    filter:
        drop-shadow(
            4px 7px 0 rgba(70,20,40,.25)
        );
}

.heart-body {

    fill:
        url(#heartGradient);

    stroke:
        #b83e61;

    stroke-width:
        3.5;

    stroke-linejoin:
        round;
}


/* =========================================
   하트 얼굴
========================================= */

.heart-face {

    position:
        absolute;

    left:
        39px;

    top:
        78px;

    width:
        60px;

    height:
        43px;

    z-index:
        40;
}

.eye {

    position:
        absolute;

    top:
        3px;

    width:
        9px;

    height:
        13px;

    background:
        #43232d;

    border-radius:
        50%;
}

.eye.left {
    left: 7px;
}

.eye.right {
    right: 7px;
}

.eye::after {

    content:
        "";

    position:
        absolute;

    left:
        2px;

    top:
        2px;

    width:
        3px;

    height:
        4px;

    background:
        white;

    border-radius:
        50%;
}

.blush {

    position:
        absolute;

    top:
        25px;

    width:
        17px;

    height:
        8px;

    background:
        #ff9aaa;

    border-radius:
        50%;

    opacity:
        .85;
}

.blush.left {
    left: -2px;
}

.blush.right {
    right: -2px;
}

.smile {

    position:
        absolute;

    left:
        22px;

    top:
        17px;

    width:
        17px;

    height:
        12px;

    border-bottom:
        3px solid #71313d;

    border-radius:
        0 0 50% 50%;
}


/* =========================================
   마술사 모자
========================================= */

.magic-hat {

    position:
        absolute;

    left:
        18px;

    top:
        1px;

    width:
        98px;

    height:
        38px;

    z-index:
        50;

    transform:
        rotate(-5deg);
}

.hat-brim {

    position:
        absolute;

    left:
        0;

    bottom:
        0;

    width:
        98px;

    height:
        23px;

    background:
        #51418e;

    border:
        3px solid #2d2458;

    border-radius:
        50%;
}

.hat-crown {

    position:
        absolute;

    left:
        27px;

    bottom:
        12px;

    width:
        47px;

    height:
        67px;

    background:
        linear-gradient(
            135deg,
            #7662c2,
            #3c306e
        );

    clip-path:
        polygon(
            47% 0,
            100% 100%,
            0 100%
        );

    border-radius:
        20px 20px 4px 4px;

    transform:
        rotate(5deg);
}

.hat-band {

    position:
        absolute;

    left:
        25px;

    bottom:
        12px;

    width:
        50px;

    height:
        8px;

    background:
        #f5c858;

    z-index:
        3;

    border-radius:
        5px;
}

.hat-star {

    position:
        absolute;

    left:
        45px;

    bottom:
        18px;

    color:
        #ffe28a;

    font-size:
        14px;

    z-index:
        5;
}


/* =========================================
   정답
   하트가 마녀를 물리침
========================================= */

.heart-attack {

    animation:
        heartAttack .85s ease forwards;
}

@keyframes heartAttack {

    0% {
        transform:
            translateX(0)
            rotate(0)
            scale(1);
    }

    35% {
        transform:
            translateX(45px)
            rotate(-8deg)
            scale(1.08);
    }

    65% {
        transform:
            translateX(105px)
            rotate(8deg)
            scale(1.15);
    }

    100% {
        transform:
            translateX(0)
            rotate(0)
            scale(1);
    }
}


/* =========================================
   하트 점프
========================================= */

.jump {

    animation:
        heartJump .75s ease;
}

@keyframes heartJump {

    0% {
        bottom:
            110px;
    }

    40% {
        bottom:
            210px;

        transform:
            rotate(-6deg)
            scale(1.05);
    }

    70% {

        bottom:
            195px;

        transform:
            rotate(6deg)
            scale(1.05);
    }

    100% {

        bottom:
            110px;

        transform:
            rotate(0)
            scale(1);
    }
}


/* =========================================
   마녀
========================================= */

.witch {

    position:
        absolute;

    right:
        -190px;

    bottom:
        145px;

    width:
        170px;

    height:
        135px;

    z-index:
        30;

    display:
        none;
}


/* =========================================
   정답:
   마녀 퇴치
========================================= */

.witch.defeated {

    display:
        block;

    animation:
        witchDefeat 1s ease forwards;
}

@keyframes witchDefeat {

    0% {

        right:
            7%;

        opacity:
            1;

        transform:
            rotate(0)
            scale(1);
    }

    30% {

        right:
            10%;

        transform:
            rotate(-10deg)
            scale(1.08);
    }

    55% {

        right:
            16%;

        transform:
            rotate(12deg)
            scale(.95);
    }

    100% {

        right:
            -220px;

        opacity:
            0;

        transform:
            rotate(35deg)
            scale(.5);
    }
}


/* =========================================
   오답:
   마녀가 하트와 꽝 충돌
========================================= */

.witch.crash {

    display:
        block;

    animation:
        witchCrash .9s ease-in forwards;
}

@keyframes witchCrash {

    0% {

        right:
            -190px;

        transform:
            translateY(0)
            rotate(0)
            scale(.9);
    }

    35% {

        right:
            30%;

        transform:
            translateY(-20px)
            rotate(-7deg)
            scale(1);
    }

    65% {

        right:
            17%;

        transform:
            translateY(5px)
            rotate(7deg)
            scale(1.05);
    }

    100% {

        right:
            8%;

        transform:
            translateY(0)
            rotate(10deg)
            scale(1.15);
    }
}


/* =========================================
   빗자루
========================================= */

.broom {

    position:
        absolute;

    left:
        10px;

    top:
        103px;

    width:
        150px;

    height:
        8px;

    background:
        #70462c;

    border-radius:
        10px;

    transform:
        rotate(-7deg);
}

.broom::after {

    content:
        "";

    position:
        absolute;

    right:
        -18px;

    top:
        -13px;

    width:
        42px;

    height:
        34px;

    background:
        repeating-linear-gradient(
            80deg,
            #c98539 0 5px,
            #e0a34e 5px 9px
        );

    clip-path:
        polygon(
            0 35%,
            100% 0,
            88% 100%,
            5% 75%
        );
}


/* =========================================
   마녀 몸
========================================= */

.witch-cape {

    position:
        absolute;

    left:
        52px;

    top:
        52px;

    width:
        76px;

    height:
        73px;

    background:
        linear-gradient(
            135deg,
            #51448b,
            #292246
        );

    clip-path:
        polygon(
            20% 0,
            80% 0,
            100% 100%,
            50% 77%,
            0 100%
        );
}


/* 머리카락 */

.witch-hair {

    position:
        absolute;

    left:
        55px;

    top:
        27px;

    width:
        63px;

    height:
        67px;

    background:
        #34223d;

    border-radius:
        50% 50% 42% 42%;

    z-index:
        4;
}


/* 얼굴 */

.witch-head {

    position:
        absolute;

    left:
        64px;

    top:
        35px;

    width:
        49px;

    height:
        52px;

    background:
        linear-gradient(
            145deg,
            #ffd9c4,
            #efb096
        );

    border:
        3px solid #a66b63;

    border-radius:
        48%;

    z-index:
        10;
}

.witch-eye {

    position:
        absolute;

    top:
        18px;

    width:
        7px;

    height:
        9px;

    background:
        #3c263d;

    border-radius:
        50%;
}

.witch-eye.left {
    left: 10px;
}

.witch-eye.right {
    right: 10px;
}

.witch-smile {

    position:
        absolute;

    left:
        17px;

    top:
        32px;

    width:
        15px;

    height:
        8px;

    border-bottom:
        2px solid #71313e;

    border-radius:
        50%;
}


/* =========================================
   마녀 모자
========================================= */

.witch-hat {

    position:
        absolute;

    left:
        43px;

    top:
        3px;

    width:
        94px;

    height:
        28px;

    background:
        #302747;

    border:
        3px solid #1d182e;

    border-radius:
        50%;

    z-index:
        30;
}

.witch-hat::before {

    content:
        "";

    position:
        absolute;

    left:
        27px;

    bottom:
        12px;

    width:
        41px;

    height:
        70px;

    background:
        linear-gradient(
            135deg,
            #554582,
            #29213e
        );

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );

    transform:
        rotate(6deg);
}

.witch-hat::after {

    content:
        "";

    position:
        absolute;

    left:
        4px;

    right:
        4px;

    bottom:
        3px;

    height:
        6px;

    background:
        #d278b5;

    border-radius:
        5px;
}


/* =========================================
   충돌 효과
========================================= */

.crash-flash {

    position:
        absolute;

    left:
        50%;

    top:
        45%;

    transform:
        translate(-50%, -50%);

    z-index:
        90;

    font-size:
        70px;

    opacity:
        0;

    pointer-events:
        none;
}

.crash-flash.show {

    animation:
        crashFlash .8s ease forwards;
}

@keyframes crashFlash {

    0% {

        opacity:
            0;

        transform:
            translate(-50%, -50%)
            scale(.3)
            rotate(-20deg);
    }

    25% {

        opacity:
            1;

        transform:
            translate(-50%, -50%)
            scale(1.25)
            rotate(10deg);
    }

    70% {

        opacity:
            1;

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(-5deg);
    }

    100% {

        opacity:
            0;

        transform:
            translate(-50%, -50%)
            scale(1.4);
    }
}


/* =========================================
   정답 효과
========================================= */

.victory-flash {

    position:
        absolute;

    left:
        50%;

    top:
        43%;

    transform:
        translate(-50%, -50%);

    z-index:
        90;

    font-size:
        60px;

    opacity:
        0;

    pointer-events:
        none;
}

.victory-flash.show {

    animation:
        victoryFlash .8s ease forwards;
}

@keyframes victoryFlash {

    0% {

        opacity:
            0;

        transform:
            translate(-50%, -50%)
            scale(.3);
    }

    30% {

        opacity:
            1;

        transform:
            translate(-50%, -50%)
            scale(1.2);
    }

    75% {

        opacity:
            1;
    }

    100% {

        opacity:
            0;

        transform:
            translate(-50%, -50%)
            scale(1.4);
    }
}


/* =========================================
   메시지
========================================= */

.message {

    position:
        absolute;

    left:
        50%;

    top:
        40%;

    transform:
        translate(-50%, -50%)
        scale(.7);

    padding:
        13px 28px;

    background:
        #fff9eb;

    border:
        5px solid #e0a458;

    border-radius:
        24px;

    color:
        #c54f69;

    font-size:
        27px;

    font-weight:
        900;

    opacity:
        0;

    pointer-events:
        none;

    z-index:
        80;

    white-space:
        nowrap;
}

.message.show {

    animation:
        popMessage 1s ease forwards;
}

@keyframes popMessage {

    0% {

        opacity:
            0;

        transform:
            translate(-50%, -50%)
            scale(.7);
    }

    20% {

        opacity:
            1;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

    80% {

        opacity:
            1;
    }

    100% {

        opacity:
            0;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =========================================
   오버레이
========================================= */

.overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        100;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(22,13,25,.88);
}

.modal {

    width:
        min(570px, 94vw);

    padding:
        30px 25px;

    background:
        linear-gradient(
            #fffaf0,
            #f8e6d3
        );

    border:
        6px solid #d8a158;

    border-radius:
        32px;

    text-align:
        center;

    color:
        #593b38;

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);

    animation:
        modalPop .35s ease;
}

@keyframes modalPop {

    from {

        transform:
            scale(.8);

        opacity:
            0;
    }

    to {

        transform:
            scale(1);

        opacity:
            1;
    }
}

.modal h1 {

    margin:
        5px 0 12px;

    color:
        #ce5570;

    font-size:
        38px;
}

.modal p {

    line-height:
        1.7;

    font-weight:
        900;
}

.start-btn {

    margin-top:
        8px;

    padding:
        14px 38px;

    border:
        0;

    border-radius:
        20px;

    background:
        linear-gradient(
            #f4859c,
            #dc5d79
        );

    color:
        white;

    font-size:
        21px;

    font-weight:
        900;

    cursor:
        pointer;

    box-shadow:
        0 6px 0 #9e4055;
}

.start-btn:active {

    transform:
        translateY(4px);

    box-shadow:
        0 2px 0 #9e4055;
}

.hidden {

    display:
        none !important;
}


/* =========================================
   시작 하트
========================================= */

.big-heart {

    font-size:
        85px;

    animation:
        heartBeat .7s infinite alternate;
}

@keyframes heartBeat {

    from {
        transform:
            scale(1);
    }

    to {
        transform:
            scale(1.1);
    }
}


/* =========================================
   성공
========================================= */

.success-heart {

    font-size:
        130px;

    animation:
        successBounce .45s infinite alternate;
}

@keyframes successBounce {

    from {

        transform:
            scale(1)
            rotate(-7deg);
    }

    to {

        transform:
            scale(1.15)
            rotate(7deg);
    }
}


/* =========================================
   복습 화면
========================================= */

<script>

/* =========================================
   게임 상태
========================================= */

let currentNote = null;

let score = 0;

let wrongCount = 0;

let gameRunning = false;

let nextTimer = null;

let witchTimer = null;

let studyInterval = null;


/* =========================================
   정확한 다장조 높은음자리표

   오선:
   첫째 줄 = 미
   첫째 칸 = 파
   둘째 줄 = 솔
   둘째 칸 = 라
   셋째 줄 = 시
   셋째 칸 = 높은 도

   오선 아래:
   첫째 칸 = 레
   첫째 덧줄 = 도
========================================= */

const NOTES = [

    {
        name: "도",
        y: 150
    },

    {
        name: "레",
        y: 137.5
    },

    {
        name: "미",
        y: 125
    },

    {
        name: "파",
        y: 112.5
    },

    {
        name: "솔",
        y: 100
    },

    {
        name: "라",
        y: 87.5
    },

    {
        name: "시",
        y: 75
    },

    {
        name: "높은 도",
        y: 62.5
    }

];


/* =========================================
   DOM
========================================= */

const quizNote =
    document.getElementById(
        "quizNote"
    );

const quizLedger =
    document.getElementById(
        "quizLedger"
    );

const answers =
    document.getElementById(
        "answers"
    );

const scoreText =

    );

const heartRunner =

        "heartRunner"
    );

const witch =
    document.getElementById(
        "witch"
    );

const message =

    );

const crashFlash =
    document.getElementById(
        "crashFlash"
    );

const victoryFlash =
    document.getElementById(
        "victoryFlash"
    );

const startOverlay =
    document.getElementById(
        "startOverlay"
    );

const successOverlay =
    document.getElementById(

    );

const studyOverlay =
    document.getElementById(
        "studyOverlay"
    );

const studyTimer =
    document.getElementById(
        "studyTimer"
    );


/* =========================================
   게임 배경음
   외부 파일 없이 Web Audio API
========================================= */

let audioContext = null;

let masterGain = null;

let musicTimer = null;

let musicStep = 0;


const melody = [

    261.63,
    329.63,
    392.00,
    523.25,

    392.00,
    329.63,
    293.66,
    329.63,

    261.63,
    329.63,
    392.00,
    659.25,

    523.25,
    392.00,
    329.63,
    261.63

];


function playNote(
    frequency,
    duration = .65
) {

    if (!audioContext) {
        return;
    }


    const now =
        audioContext.currentTime;


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        "triangle";


    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .07,
        now + .025
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
    );


    oscillator.connect(gain);

    gain.connect(
        masterGain
    );


    oscillator.start(now);

    oscillator.stop(
        now + duration + .03
    );
}


function startMusic() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        masterGain =
            audioContext.createGain();


        masterGain.gain.value =
            .45;


        masterGain.connect(
            audioContext.destination
        );
    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    if (musicTimer) {
        return;
    }


    musicStep = 0;


    function loopMusic() {

        if (!gameRunning) {
            return;
        }


        const frequency =
            melody[
                musicStep %
                melody.length
            ];


        playNote(
            frequency,
            .7
        );


        if (
            musicStep % 4 === 0
        ) {

            playNote(
                frequency / 2,
                .9
            );

        }


        musicStep++;


        musicTimer =
            setTimeout(
                loopMusic,
                620
            );
    }


    loopMusic();
}


function stopMusic() {

    if (musicTimer) {

        clearTimeout(
            musicTimer
        );

        musicTimer = null;

    }

    musicStep = 0;
}


/* =========================================
   게임 시작
========================================= */

function startGame() {

    clearTimers();

    stopMusic();


    startOverlay.classList.add(
        "hidden"
    );

    successOverlay.classList.add(
        "hidden"
    );

    studyOverlay.classList.add(
        "hidden"
    );


    score = 0;

    wrongCount = 0;


    scoreText.textContent =
        "0";


    gameRunning = true;


    resetCharacters();


    startMusic();


    makeQuestion();
}


/* =========================================
   문제 생성
========================================= */

function makeQuestion() {

    if (!gameRunning) {
        return;
    }


    resetCharacters();


    const index =
        Math.floor(
            Math.random() *
            NOTES.length
        );


    currentNote =
        NOTES[index];


    quizNote.setAttribute(
        "cy",
        currentNote.y
    );


    /*
       도일 때만 아래 덧줄
    */

    if (
        currentNote.name === "도"
    ) {

        quizLedger.style.display =
            "block";


        quizLedger.setAttribute(
            "y1",
            currentNote.y
        );


        quizLedger.setAttribute(
            "y2",
            currentNote.y
        );

    }

    else {

        quizLedger.style.display =
            "none";

    }


    createAnswers();
}


/* =========================================
   보기 만들기
========================================= */

function createAnswers() {

    answers.innerHTML =
        "";


    let choices = [
        currentNote.name
    ];


    while (
        choices.length < 4
    ) {

        const randomNote =
            NOTES[
                Math.floor(
                    Math.random() *
                    NOTES.length
                )
            ];


        if (
            !choices.includes(
                randomNote.name
            )
        ) {

            choices.push(
                randomNote.name
            );

        }

    }


    /*
       보기 섞기
    */

    for (
        let i = choices.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            choices[i],
            choices[j]
        ] =
        [
            choices[j],
            choices[i]
        ];

    }


    choices.forEach(
        choice => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.textContent =
                choice;


            button.onclick =
                () =>
                checkAnswer(
                    choice,
                    button
                );


            answers.appendChild(
                button
            );

        }
    );
}


/* =========================================
   정답 검사
========================================= */

function checkAnswer(
    answer,
    button
) {

    if (!gameRunning) {
        return;
    }


    document
        .querySelectorAll(
            ".answer"
        )
        .forEach(
            item => {

                item.disabled =
                    true;

            }
        );


    if (
        answer ===
        currentNote.name
    ) {

        button.classList.add(
            "correct"
        );


        correctAnswer();

    }

    else {

        button.classList.add(
            "wrong"
        );


        wrongAnswer();

    }
}


/* =========================================
   정답
   → 무조건 마녀를 물리침
========================================= */

function correctAnswer() {

    score++;


    scoreText.textContent =
        score;


    showMessage(
        "정답! 마녀를 물리쳤어요! ⚡"
    );


    /*
       하트가 앞으로 공격
    */

    heartRunner.classList.remove(
        "heart-attack"
    );


    void heartRunner.offsetWidth;


    heartRunner.classList.add(
        "heart-attack"
    );


    /*
       마녀 등장 후
       물리치는 연출
    */

    witch.classList.remove(
        "crash"
    );

    witch.classList.remove(
        "defeated"
    );


    void witch.offsetWidth;


    witch.classList.add(
        "defeated"
    );


    /*
       승리 효과
    */

    victoryFlash.classList.remove(
        "show"
    );


    void victoryFlash.offsetWidth;


    victoryFlash.classList.add(
        "show"
    );


    /*
       5회 성공
    */

    if (
        score >= 5
    ) {

        gameRunning =
            false;


        stopMusic();


        setTimeout(
            () => {

                successOverlay.classList.remove(
                    "hidden"
                );

            },
            900
        );


        return;
    }


    /*
       다음 문제
    */

    nextTimer =
        setTimeout(
            () => {

                makeQuestion();

            },
            1050
        );
}


/* =========================================
   오답
   → 무조건 마녀와 꽝 충돌
========================================= */

function wrongAnswer() {

    wrongCount++;


    /*
       하트 정지
    */

    heartRunner.classList.remove(
        "jump"
    );


    heartRunner.classList.remove(
        "heart-attack"
    );


    /*
       마녀 등장
    */

    witch.classList.remove(
        "defeated"
    );

    witch.classList.remove(
        "crash"
    );


    void witch.offsetWidth;


    /*
       마녀가 하트에게 돌진
    */

    witch.classList.add(
        "crash"
    );


    /*
       실제 충돌 순간
    */

    setTimeout(
        () => {

            crashFlash.classList.remove(
                "show"
            );


            void crashFlash.offsetWidth;


            crashFlash.classList.add(
                "show"
            );


            showMessage(
                "꽝! 마녀와 충돌했어요! 💥"
            );

        },
        620
    );


    /*
       실패 3회
    */

    if (
        wrongCount >= 3
    ) {

        gameRunning =
            false;


        stopMusic();


        setTimeout(
            () => {

                showStudyScreen();

            },
            1450
        );


        return;
    }


    /*
       실패했으면
       충돌 후 다음 문제
    */

    nextTimer =
        setTimeout(
            () => {

                resetCharacters();

                makeQuestion();

            },
            1450
        );
}


/* =========================================
   캐릭터 초기화
========================================= */

function resetCharacters() {

    witch.classList.remove(
        "crash"
    );

    witch.classList.remove(
        "defeated"
    );


    heartRunner.classList.remove(
        "jump"
    );

    heartRunner.classList.remove(
        "heart-attack"
    );


    crashFlash.classList.remove(
        "show"
    );

    victoryFlash.classList.remove(
        "show"
    );
}


/* =========================================
   메시지
========================================= */

function showMessage(text) {

    message.textContent =
        text;


    message.classList.remove(
        "show"
    );


    void message.offsetWidth;


    message.classList.add(
        "show"
    );
}


/* =========================================
   복습 화면
========================================= */

function showStudyScreen() {

    studyOverlay.classList.remove(
        "hidden"
    );


    let time = 5;


    studyTimer.textContent =
        time;


    studyInterval =
        setInterval(
            () => {

                time--;


                studyTimer.textContent =
                    time;


                if (
                    time <= 0
                ) {

                    clearInterval(
                        studyInterval
                    );


                    studyInterval =
                        null;


                    restartGame();

                }

            },
            1000
        );
}


/* =========================================
   다시 시작
========================================= */

function restartGame() {

    startGame();
}


/* =========================================
   타이머 정리
========================================= */

function clearTimers() {

    if (nextTimer) {

        clearTimeout(
            nextTimer
        );

        nextTimer = null;

    }


    if (witchTimer) {

        clearTimeout(
            witchTimer
        );

        witchTimer = null;

    }


    if (studyInterval) {

        clearInterval(
            studyInterval
        );

        studyInterval = null;

    }
}


/* =========================================
   키보드 1~4 지원
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if (!gameRunning) {
            return;
        }


        const number =
            Number(event.key);


        if (
            number >= 1 &&
            number <= 4
        ) {

            const buttons =
                document.querySelectorAll(
                    ".answer"
                );


            if (
                buttons[number - 1]
            ) {

                buttons[
                    number - 1
                ].click();

            }

        }

    }
);

</script>
