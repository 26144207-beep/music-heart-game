<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#fff5dc">

<title>하트의 계이름 오페라 🎩</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #fff9ee 0%,
            #ffe9d6 55%,
            #f7d9ce 100%
        );

    color: #38272d;
    overflow-x: hidden;
}

/* =========================
   전체 게임
========================= */

#game {
    width: 100%;
    max-width: 900px;
    min-height: 100svh;
    margin: 0 auto;
    padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(22px, env(safe-area-inset-bottom));

    position: relative;
}

/* =========================
   제목
========================= */

h1 {
    margin: 10px 0 5px;
    text-align: center;

    font-size: clamp(27px, 7vw, 48px);
    line-height: 1.15;
    font-weight: 900;

    color: #8e415b;

    text-shadow:
        2px 2px 0 #fff,
        0 3px 8px rgba(90, 40, 50, .12);
}

.subtitle {
    text-align: center;
    font-size: clamp(14px, 3.8vw, 20px);
    font-weight: 700;
    margin-bottom: 10px;
}

/* =========================
   점수
========================= */

.score {
    width: fit-content;
    margin: 0 auto 12px;

    background: rgba(255,255,255,.82);
    border-radius: 999px;

    padding: 8px 18px;

    font-size: clamp(16px, 4vw, 22px);
    font-weight: 900;

    box-shadow: 0 4px 12px rgba(80,40,50,.12);
}

/* =========================
   오페라 무대
========================= */

.stage {
    position: relative;

    width: 100%;
    min-height: 530px;

    overflow: hidden;

    border-radius: 28px;

    background:
        radial-gradient(
            ellipse at center 30%,
            #fff6dc 0%,
            #f9d8b9 45%,
            #b86b68 100%
        );

    border: 5px solid #8e415b;

    box-shadow:
        0 12px 35px rgba(70,30,40,.22),
        inset 0 0 0 5px rgba(255,255,255,.45);
}

/* 오페라 커튼 */

.stage::before,
.stage::after {
    content: "";
    position: absolute;
    top: 0;
    width: 22%;
    height: 100%;

    background:
        repeating-linear-gradient(
            90deg,
            #8f304d 0px,
            #8f304d 14px,
            #b84961 14px,
            #b84961 27px,
            #7d2742 27px,
            #7d2742 40px
        );

    z-index: 1;
}

.stage::before {
    left: 0;
    border-radius: 0 0 70px 0;
    box-shadow: 8px 0 20px rgba(60,20,30,.25);
}

.stage::after {
    right: 0;
    border-radius: 0 0 0 70px;
    box-shadow: -8px 0 20px rgba(60,20,30,.25);
}

/* 무대 중앙 */

.stage-center {
    position: absolute;
    left: 22%;
    right: 22%;
    top: 0;
    bottom: 0;

    background:
        radial-gradient(
            ellipse at center 30%,
            rgba(255,255,255,.95),
            rgba(255,235,196,.5) 45%,
            rgba(255,190,150,.2) 75%,
            transparent
        );

    z-index: 2;
}

/* =========================
   문제 영역
========================= */

.question {
    position: relative;
    z-index: 10;

    width: calc(100% - 32px);
    max-width: 680px;

    margin: 20px auto 0;

    background: rgba(255,255,255,.94);

    border-radius: 24px;

    padding: 16px;

    text-align: center;

    box-shadow:
        0 7px 20px rgba(70,30,40,.15);
}

.question-title {
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 900;
    margin-bottom: 8px;
}

/* =========================
   오선지
========================= */

.staff-wrap {
    width: 100%;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
}

.staff {
    width: min(650px, 100%);
    height: auto;

    display: block;
}

/*
  SVG 좌표

  오선:
  y = 55
  y = 67
  y = 79
  y = 91
  y = 103

  높은음자리표가
  오선의 시작 부분에 정확하게 걸리도록 배치
*/

.staff-line {
    stroke: #171717;
    stroke-width: 2.2;
}

.clef {
    font-family: serif;
    font-size: 72px;
    font-weight: normal;
}

/* 음표 */

.note {
    fill: #111;
}

.note-hole {
    fill: #fff;
}

/* =========================
   답 버튼
========================= */

.answers {
    position: relative;
    z-index: 20;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 8px;

    width: calc(100% - 32px);
    max-width: 680px;

    margin: 14px auto 0;
}

.answer {
    appearance: none;
    border: 0;

    min-height: 54px;

    border-radius: 18px;

    background: #fff;

    color: #673747;

    font-size: clamp(18px, 5vw, 26px);
    font-weight: 900;

    box-shadow:
        0 4px 0 #d8a5a9,
        0 7px 12px rgba(70,30,40,.12);

    touch-action: manipulation;

    cursor: pointer;

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.answer:active {
    transform: translateY(4px);
    box-shadow:
        0 1px 0 #d8a5a9;
}

/* =========================
   하트 캐릭터
========================= */

.hero-heart {
    position: absolute;

    left: 50%;
    bottom: 78px;

    width: 92px;
    height: 82px;

    transform: translateX(-50%);

    z-index: 8;

    filter:
        drop-shadow(0 7px 5px rgba(80,30,40,.22));
}

/*
   원 두 개를 붙인 느낌이 아니라
   하나의 부드러운 path로 하트를 그림
*/

.heart-shape {
    width: 100%;
    height: 100%;
}

.hat {
    position: absolute;

    width: 64px;
    height: 27px;

    left: 14px;
    top: -12px;

    background: #46333d;

    border-radius:
        45% 45% 15% 15%;

    transform: rotate(-4deg);

    box-shadow:
        0 4px 0 #2c2027;
}

.hat::after {
    content: "";

    position: absolute;

    left: -8px;
    right: -8px;
    bottom: -5px;

    height: 8px;

    background: #2c2027;

    border-radius: 999px;
}

/* =========================
   마녀
========================= */

.witch {
    position: absolute;

    right: 17%;
    bottom: 76px;

    z-index: 7;

    width: 88px;
    height: 125px;

    transition:
        transform .35s ease;
}

.witch-body {
    position: absolute;

    left: 18px;
    bottom: 0;

    width: 55px;
    height: 72px;

    background: #493d65;

    border-radius:
        50% 50% 18% 18%;
}

.witch-head {
    position: absolute;

    left: 20px;
    top: 12px;

    width: 50px;
    height: 50px;

    background: #f2c8a7;

    border-radius: 50%;
}

.witch-head::before {
    content: "";

    position: absolute;

    left: 9px;
    top: 20px;

    width: 7px;
    height: 7px;

    background: #38272d;

    border-radius: 50%;

    box-shadow: 25px 0 #38272d;
}

.witch-hat {
    position: absolute;

    left: 8px;
    top: -2px;

    width: 75px;
    height: 18px;

    background: #30283d;

    border-radius: 50%;
}

.witch-hat::before {
    content: "";

    position: absolute;

    left: 20px;
    bottom: 7px;

    width: 35px;
    height: 60px;

    background: #30283d;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );

    transform: rotate(5deg);
}

/* 지휘봉 */

.wand {
    position: absolute;

    width: 52px;
    height: 4px;

    background: #392c32;

    right: -34px;
    top: 63px;

    transform: rotate(-32deg);

    border-radius: 999px;
}

.wand::after {
    content: "⚡";

    position: absolute;

    right: -27px;
    top: -21px;

    font-size: 32px;

    animation:
        spark .55s infinite alternate;
}

@keyframes spark {
    from {
        transform: scale(.8);
        opacity: .55;
    }

    to {
        transform: scale(1.2);
        opacity: 1;
    }
}

/* =========================
   결과 메시지
========================= */

.message {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(255,245,225,.94);

    text-align: center;
}

.message.show {
    display: flex;
}

.message-box {
    width: min(90%, 600px);

    background: white;

    border-radius: 30px;

    padding: 35px 20px;

    box-shadow:
        0 15px 50px rgba(70,30,40,.2);
}

.message-title {
    font-size: clamp(42px, 12vw, 80px);

    font-weight: 1000;

    color: #d34e73;

    margin-bottom: 15px;
}

.message-text {
    font-size: clamp(18px, 5vw, 28px);
    font-weight: 800;

    line-height: 1.5;
}

/* =========================
   시작 버튼
========================= */

.start {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 200;

    width: min(80%, 330px);

    padding: 18px 25px;

    border: 0;

    border-radius: 999px;

    background: #d95b79;

    color: white;

    font-size: 22px;
    font-weight: 900;

    box-shadow:
        0 7px 0 #a63e59,
        0 12px 20px rgba(70,30,40,.2);

    cursor: pointer;
}

.start:active {
    transform:
        translate(-50%, calc(-50% + 4px));

    box-shadow:
        0 3px 0 #a63e59;
}

/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    #game {
        padding-left: 10px;
        padding-right: 10px;
    }

    h1 {
        font-size: 28px;
    }

    .stage {
        min-height: 560px;
        border-radius: 22px;
    }

    .stage::before,
    .stage::after {
        width: 18%;
    }

    .stage-center {
        left: 18%;
        right: 18%;
    }

    .question {
        width: calc(100% - 20px);
        padding: 12px 8px;
        margin-top: 12px;
    }

    .staff {
        width: 100%;
        min-width: 0;
    }

    .answers {
        width: calc(100% - 20px);

        grid-template-columns:
            repeat(4, minmax(0, 1fr));

        gap: 6px;
    }

    .answer {
        min-height: 50px;
        border-radius: 15px;
        font-size: 19px;
    }

    .hero-heart {
        width: 78px;
        height: 70px;
        bottom: 82px;
    }

    .witch {
        right: 7%;
        bottom: 80px;

        transform: scale(.78);
        transform-origin: bottom right;
    }
}

/* 아주 작은 화면 */

@media (max-width: 380px) {

    h1 {
        font-size: 25px;
    }

    .subtitle {
        font-size: 13px;
    }

    .stage {
        min-height: 520px;
    }

    .answer {
        font-size: 17px;
        min-height: 46px;
    }

    .hero-heart {
        bottom: 75px;
    }

    .witch {
        bottom: 73px;
    }
}
</style>
</head>

<body>

<div id="game">

    <h1>하트의 계이름 오페라 🎩</h1>

    <div class="score">
        정답 <span id="score">0</span> / 5
    </div>

    <div class="subtitle">
        높은음자리표를 보고 계이름을 맞혀보세요!
    </div>

    <div class="stage">

        <div class="stage-center"></div>

        <!-- 문제 -->
        <div class="question">

            <div class="question-title">
                이 음표의 계이름은?
            </div>

            <div class="staff-wrap">

                <!--
                    오선지 + 높은음자리표 + 음표
                    모바일에서도 크기가 함께 줄어들도록
                    SVG viewBox 사용
                -->

                <svg
                    id="staff"
                    class="staff"
                    viewBox="0 0 700 150"
                    preserveAspectRatio="xMidYMid meet"
                    xmlns="http://www.w3.org/2000/svg">

                    <!-- 오선 -->
                    <line class="staff-line"
                          x1="50" y1="55"
                          x2="670" y2="55"/>

                    <line class="staff-line"
                          x1="50" y1="67"
                          x2="670" y2="67"/>

                    <line class="staff-line"
                          x1="50" y1="79"
                          x2="670" y2="79"/>

                    <line class="staff-line"
                          x1="50" y1="91"
                          x2="670" y2="91"/>

                    <line class="staff-line"
                          x1="50" y1="103"
                          x2="670" y2="103"/>

                    <!-- 높은음자리표 -->
                    <text
                        class="clef"
                        x="28"
                        y="102">
                        𝄞
                    </text>

                    <!-- 음표가 여기에 들어감 -->
                    <g id="noteGroup"></g>

                </svg>

            </div>

        </div>

        <!-- 하트 -->
        <div class="hero-heart">

            <svg
                class="heart-shape"
                viewBox="0 0 100 90"
                xmlns="http://www.w3.org/2000/svg">

                <path
                    d="
                    M50 84
                    C45 79 9 58 9 29
                    C9 14 20 5 33 5
                    C42 5 48 10 50 18
                    C53 10 59 5 68 5
                    C81 5 92 14 92 29
                    C92 58 56 79 50 84
                    Z"
                    fill="#f36d8c"
                    stroke="#b94163"
                    stroke-width="3"
                />

                <!-- 눈 -->
                <ellipse
                    cx="37"
                    cy="39"
                    rx="4"
                    ry="5"
                    fill="#39272d"/>

                <ellipse
                    cx="63"
                    cy="39"
                    rx="4"
                    ry="5"
                    fill="#39272d"/>

                <!-- 볼 -->
                <ellipse
                    cx="27"
                    cy="51"
                    rx="6"
                    ry="3"
                    fill="#f9a0ad"
                    opacity=".8"/>

                <ellipse
                    cx="73"
                    cy="51"
                    rx="6"
                    ry="3"
                    fill="#f9a0ad"
                    opacity=".8"/>

                <!-- 입 -->
                <path
                    d="M44 53 Q50 59 56 53"
                    fill="none"
                    stroke="#7e3149"
                    stroke-width="3"
                    stroke-linecap="round"/>
            </svg>

            <div class="hat"></div>

        </div>

        <!-- 마녀 -->
        <div class="witch" id="witch">

            <div class="witch-body"></div>
            <div class="witch-head"></div>
            <div class="witch-hat"></div>
            <div class="wand"></div>

        </div>

        <!-- 답 -->
        <div class="answers">

            <button class="answer" data-answer="도">도</button>
            <button class="answer" data-answer="레">레</button>
            <button class="answer" data-answer="미">미</button>
            <button class="answer" data-answer="파">파</button>
            <button class="answer" data-answer="솔">솔</button>
            <button class="answer" data-answer="라">라</button>
            <button class="answer" data-answer="시">시</button>
            <button class="answer" data-answer="높은 도">높은 도</button>

        </div>

        <!-- 시작 -->
        <button
            id="startBtn"
            class="start">
            🎩 게임 시작!
        </button>

        <!-- 결과 -->
        <div
            id="message"
            class="message">

            <div class="message-box">

                <div
                    id="messageTitle"
                    class="message-title">
                </div>

                <div
                    id="messageText"
                    class="message-text">
                </div>

            </div>

        </div>

    </div>

</div>


<!--
========================================================
음악

중요:
아이폰 Safari는 사용자 터치 없이 소리가 나는 자동재생을
차단할 수 있음.

따라서 아래처럼 audio를 준비하고,
"게임 시작" 버튼을 누르는 순간 play()를 호출한다.
========================================================
-->

<audio
    id="bgMusic"
    loop
    preload="auto"
    playsinline>

    <!--
        같은 GitHub 저장소에 music.mp3가 있다면 사용.

        예:
        music-heart-game/
          index.html
          music.mp3
    -->

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<script>

/* =====================================================
   게임 데이터

   오선지의 정확한 위치와 계이름을 한 세트로 관리한다.

   y 좌표:
   55 = 높은 레
   67 = 높은 도
   79 = 시
   91 = 라
   103 = 솔
   115 = 파
   127 = 미
   139 = 도

   단, 현재 화면에서는 150 높이 안에서
   오선 아래 음표까지 보이도록 구성한다.
===================================================== */

const notes = [

    {
        name: "도",
        y: 127
    },

    {
        name: "레",
        y: 115
    },

    {
        name: "미",
        y: 103
    },

    {
        name: "파",
        y: 91
    },

    {
        name: "솔",
        y: 79
    },

    {
        name: "라",
        y: 67
    },

    {
        name: "시",
        y: 55
    },

    {
        name: "높은 도",
        y: 43
    }

];


/* =====================================================
   상태
===================================================== */

let currentNote = null;

let score = 0;

let wrongCount = 0;

let gameStarted = false;

const scoreEl =
    document.getElementById("score");

const noteGroup =
    document.getElementById("noteGroup");

const startBtn =
    document.getElementById("startBtn");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const witch =
    document.getElementById("witch");

const bgMusic =
    document.getElementById("bgMusic");


/* =====================================================
   음표 그리기

   음표 막대기는 사용하지 않는다.
   검은 타원 + 흰색 중심으로만 표현한다.
===================================================== */

function drawNote(note) {

    noteGroup.innerHTML = "";

    const cx = 350;

    const cy = note.y;

    const ns =
        "http://www.w3.org/2000/svg";

    /* 음표 타원 */

    const ellipse =
        document.createElementNS(
            ns,
            "ellipse"
        );

    ellipse.setAttribute(
        "cx",
        cx
    );

    ellipse.setAttribute(
        "cy",
        cy
    );

    ellipse.setAttribute(
        "rx",
        "15"
    );

    ellipse.setAttribute(
        "ry",
        "10"
    );

    ellipse.setAttribute(
        "transform",
        `rotate(-8 ${cx} ${cy})`
    );

    ellipse.setAttribute(
        "class",
        "note"
    );

    noteGroup.appendChild(
        ellipse
    );

    /*
        가운데를 하얗게 남겨
        음표가 까맣게 꽉 차 보이지 않도록 한다.
    */

    const hole =
        document.createElementNS(
            ns,
            "ellipse"
        );

    hole.setAttribute(
        "cx",
        cx + 2
    );

    hole.setAttribute(
        "cy",
        cy - 1
    );

    hole.setAttribute(
        "rx",
        "6"
    );

    hole.setAttribute(
        "ry",
        "3.5"
    );

    hole.setAttribute(
        "transform",
        `rotate(-8 ${cx + 2} ${cy - 1})`
    );

    hole.setAttribute(
        "class",
        "note-hole"
    );

    noteGroup.appendChild(
        hole
    );
}


/* =====================================================
   새 문제
===================================================== */

function newQuestion() {

    const index =
        Math.floor(
            Math.random() * notes.length
        );

    currentNote =
        notes[index];

    drawNote(
        currentNote
    );
}


/* =====================================================
   음악 시작

   아이폰에서 자동재생이 막힐 수 있으므로
   반드시 버튼 터치 안에서 실행한다.
===================================================== */

async function startMusic() {

    try {

        bgMusic.volume = 0.35;

        await bgMusic.play();

    } catch (error) {

        console.log(
            "음악 재생이 브라우저에 의해 차단됨:",
            error
        );

    }
}


/* =====================================================
   게임 시작
===================================================== */

startBtn.addEventListener(
    "click",
    async function() {

        gameStarted = true;

        score = 0;
        wrongCount = 0;

        scoreEl.textContent =
            score;

        startBtn.style.display =
            "none";

        message.classList.remove(
            "show"
        );

        /*
            중요한 부분:
            이 함수는 사용자가 직접 버튼을
            누른 순간 실행되므로
            아이폰에서도 음악 재생이
            허용될 가능성이 가장 높다.
        */

        await startMusic();

        newQuestion();

    },
    { passive: true }
);


/* =====================================================
   정답 처리
===================================================== */

document
    .querySelectorAll(".answer")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                if (!gameStarted) {
                    return;
                }

                const answer =
                    this.dataset.answer;

                /*
                    현재 문제의 name과
                    버튼의 data-answer를
                    직접 비교한다.
                */

                if (
                    answer ===
                    currentNote.name
                ) {

                    correct();

                } else {

                    wrong();

                }

            },
            { passive: true }
        );

    });


/* =====================================================
   정답
===================================================== */

function correct() {

    score++;

    scoreEl.textContent =
        score;

    /*
        하트가 마녀에게 돌진
    */

    const heart =
        document.querySelector(
            ".hero-heart"
        );

    heart.animate(
        [
            {
                transform:
                    "translateX(-50%)"
            },

            {
                transform:
                    "translateX(110px) scale(1.08)"
            },

            {
                transform:
                    "translateX(-50%)"
            }
        ],
        {
            duration: 550,
            easing: "ease-out"
        }
    );

    /*
        마녀가 공격받음
    */

    witch.animate(
        [
            {
                transform:
                    "rotate(0deg)"
            },

            {
                transform:
                    "rotate(-15deg) translateX(20px)"
            },

            {
                transform:
                    "rotate(15deg) translateX(-15px)"
            },

            {
                transform:
                    "rotate(0deg)"
            }
        ],
        {
            duration: 550
        }
    );

    /*
        5회 성공
    */

    if (score >= 5) {

        showSuccess();

        return;
    }

    setTimeout(
        newQuestion,
        650
    );
}


/* =====================================================
   오답
===================================================== */

function wrong() {

    wrongCount++;

    /*
        하트와 마녀가 직접 충돌하는 느낌
    */

    const heart =
        document.querySelector(
            ".hero-heart"
        );

    heart.animate(
        [
            {
                transform:
                    "translateX(-50%)"
            },

            {
                transform:
                    "translateX(105px)"
            },

            {
                transform:
                    "translateX(60px) scale(1.08)"
            },

            {
                transform:
                    "translateX(-50%)"
            }
        ],
        {
            duration: 600,
            easing: "ease-out"
        }
    );

    witch.animate(
        [
            {
                transform:
                    "translateX(0)"
            },

            {
                transform:
                    "translateX(-35px)"
            },

            {
                transform:
                    "translateX(-15px)"
            },

            {
                transform:
                    "translateX(0)"
            }
        ],
        {
            duration: 600
        }
    );

    /*
        3회 틀리면 복습
    */

    if (wrongCount >= 3) {

        showReview();

        return;
    }

    setTimeout(
        newQuestion,
        700
    );
}


/* =====================================================
   성공
===================================================== */

function showSuccess() {

    gameStarted = false;

    messageTitle.textContent =
        "🎉 성공! 🎉";

    messageText.innerHTML =
        "하트가 마녀를 모두 물리쳤어요!<br><br>" +
        "🎩💗✨💗🎩";

    message.classList.add(
        "show"
    );

}


/* =====================================================
   3회 실패 → 복습
===================================================== */

function showReview() {

    gameStarted = false;

    messageTitle.textContent =
        "📖 계이름 복습";

    messageText.innerHTML = `
        <div style="
            font-size:clamp(17px,4vw,24px);
            line-height:1.9;
            font-weight:900;
        ">
            도 → 레 → 미 → 파<br>
            솔 → 라 → 시 → 높은 도
            <br><br>
            <span style="font-size:42px;">
                🎼
            </span>
            <br>
            5초 동안 복습해요!
        </div>
    `;

    message.classList.add(
        "show"
    );

    setTimeout(
        function() {

            message.classList.remove(
                "show"
            );

            score = 0;
            wrongCount = 0;

            scoreEl.textContent =
                score;

            gameStarted = true;

            newQuestion();

        },
        5000
    );
}


/* =====================================================
   첫 로딩

   페이지가 열렸을 때 문제는 미리 준비하지만
   음악은 아이폰 자동재생 정책 때문에
   사용자가 게임 시작을 눌렀을 때 재생한다.
===================================================== */

newQuestion();


/* =====================================================
   사용자가 화면을 처음 터치했을 때도
   음악을 시작할 수 있도록 보조 처리

   이미 재생 중이면 아무 일도 하지 않는다.
===================================================== */

document.addEventListener(
    "touchstart",
    function() {

        if (
            gameStarted &&
            bgMusic.paused
        ) {

            startMusic();

        }

    },
    {
        passive: true,
        once: false
    }
);

</script>

</body>
</html>
