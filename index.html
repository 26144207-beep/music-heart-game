<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>하트의 계이름 모험</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    background:
        radial-gradient(circle at 50% 20%, #fff8ec 0%, #eadccf 45%, #b9a89c 100%);

    color: #332525;
}

/* 전체 화면 */
#app {
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 16px;
}

/* 오페라 극장 */
.theater {
    position: relative;

    width: min(100%, 900px);
    min-height: 720px;

    overflow: hidden;

    border-radius: 28px;

    background:
        linear-gradient(
            to bottom,
            #311722 0%,
            #4d1729 28%,
            #25101a 100%
        );

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);

    border: 5px solid #d6a85c;
}

/* 천장 */
.ceiling {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 115px;

    background:
        radial-gradient(
            ellipse at center bottom,
            #d8a960 0 4%,
            #7b3a38 5% 20%,
            #3b1823 21% 100%
        );

    opacity: .9;
}

/* 무대 */
.stage {
    position: absolute;

    left: 5%;
    right: 5%;
    bottom: 5%;

    height: 58%;

    border-radius: 50% 50% 20px 20px;

    background:
        radial-gradient(
            ellipse at center,
            #f4dfc0 0%,
            #bc7b63 42%,
            #5e2830 75%,
            #35141d 100%
        );

    box-shadow:
        inset 0 0 40px rgba(0,0,0,.4);
}

/* 커튼 */
.curtain {
    position: absolute;
    top: 85px;

    width: 17%;
    height: 52%;

    background:
        repeating-linear-gradient(
            90deg,
            #6d1328 0px,
            #8d1c32 14px,
            #541020 28px
        );

    box-shadow:
        inset -15px 0 20px rgba(0,0,0,.3),
        inset 15px 0 20px rgba(0,0,0,.3);

    z-index: 2;
}

.curtain.left {
    left: 0;
    border-radius: 0 35% 45% 0;
}

.curtain.right {
    right: 0;
    border-radius: 35% 0 0 45%;
}

/* 제목 */
.header {
    position: relative;
    z-index: 10;

    text-align: center;

    padding: 28px 18px 0;
}

.title {
    margin: 0;

    color: #fff4d6;

    font-size: clamp(28px, 7vw, 48px);
    font-weight: 900;

    letter-spacing: -2px;

    text-shadow:
        3px 3px 0 #702033,
        0 5px 15px rgba(0,0,0,.35);
}

.subtitle {
    margin-top: 8px;

    color: #ffe9c0;

    font-size: clamp(14px, 3.8vw, 19px);
}

/* 점수 */
.score-board {
    position: relative;
    z-index: 10;

    display: flex;
    justify-content: center;
    gap: 12px;

    margin: 15px auto;

    padding: 0 15px;
}

.score {
    min-width: 105px;

    padding: 8px 14px;

    background: rgba(255,255,255,.9);

    border-radius: 20px;

    font-weight: 800;

    font-size: clamp(14px, 3.5vw, 18px);

    box-shadow: 0 4px 10px rgba(0,0,0,.18);
}

/* 게임 영역 */
.game-area {
    position: relative;
    z-index: 10;

    width: calc(100% - 30px);

    max-width: 780px;

    margin: 0 auto;

    padding: 15px;

    background: rgba(255,248,235,.94);

    border-radius: 25px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

/* 문제 */
.question {
    text-align: center;

    font-size: clamp(18px, 5vw, 27px);

    font-weight: 900;

    margin-bottom: 10px;

    color: #452631;
}

/* 오선지 */
.staff-box {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin: 0 auto 8px;

    overflow: hidden;
}

.staff {
    width: 100%;
    max-width: 720px;

    height: auto;

    display: block;
}

/* 선택지 */
.answers {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 9px;

    margin-top: 12px;
}

.answer-btn {
    border: none;

    min-height: 48px;

    border-radius: 15px;

    background:
        linear-gradient(
            180deg,
            #fff7dc,
            #f6c9b9
        );

    color: #4b2931;

    font-size: clamp(15px, 4vw, 20px);

    font-weight: 900;

    box-shadow:
        0 4px 0 #b57a72;

    cursor: pointer;

    touch-action: manipulation;
}

.answer-btn:active {
    transform: translateY(3px);

    box-shadow:
        0 1px 0 #b57a72;
}

.answer-btn:disabled {
    opacity: .5;
}

/* 캐릭터 */
.character-zone {
    position: relative;

    height: 120px;

    margin-top: 5px;

    overflow: hidden;
}

/* 하트 */
.heart {
    position: absolute;

    left: 12%;

    bottom: 20px;

    width: 72px;
    height: 72px;

    transform: rotate(-45deg);

    background:
        linear-gradient(
            135deg,
            #ff5c91,
            #e92868
        );

    border-radius:
        45% 10% 45% 10%;

    box-shadow:
        0 7px 12px rgba(0,0,0,.25);

    z-index: 5;

    transition:
        left .45s ease,
        transform .35s ease;
}

/* 하트 위쪽 둥근 부분 */
.heart::before,
.heart::after {
    content: "";

    position: absolute;

    width: 72px;
    height: 72px;

    background:
        linear-gradient(
            135deg,
            #ff5c91,
            #e92868
        );

    border-radius: 50%;
}

.heart::before {
    top: -36px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 36px;
}

/* 하트 얼굴 */
.face {
    position: absolute;

    z-index: 8;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    width: 48px;

    text-align: center;

    font-size: 22px;

    white-space: nowrap;
}

/* 모자 */
.hat {
    position: absolute;

    z-index: 9;

    left: 50%;
    top: -30px;

    transform:
        translateX(-50%)
        rotate(45deg);

    width: 45px;
    height: 28px;

    background: #392438;

    border-radius: 50% 50% 5px 5px;

    border-bottom: 6px solid #d6a85c;
}

.hat::after {
    content: "";

    position: absolute;

    left: -9px;
    bottom: -7px;

    width: 63px;
    height: 7px;

    border-radius: 50%;

    background: #d6a85c;
}

/* 마녀 */
.witch {
    position: absolute;

    right: 11%;

    bottom: 18px;

    width: 85px;
    height: 105px;

    z-index: 4;

    transition:
        transform .35s ease,
        opacity .35s ease;
}

/* 마녀 머리 */
.witch-head {
    position: absolute;

    left: 18px;
    top: 25px;

    width: 50px;
    height: 50px;

    background: #9b77b7;

    border-radius: 50%;

    border: 3px solid #442443;
}

/* 마녀 얼굴 */
.witch-head::before {
    content: "•  •";

    position: absolute;

    left: 8px;
    top: 15px;

    color: #321b39;

    font-size: 13px;

    letter-spacing: 7px;
}

.witch-head::after {
    content: "⌣";

    position: absolute;

    left: 19px;
    top: 28px;

    font-size: 18px;
}

/* 마녀 몸 */
.witch-body {
    position: absolute;

    left: 10px;
    bottom: 0;

    width: 68px;
    height: 65px;

    background:
        linear-gradient(
            135deg,
            #4c2759,
            #21142d
        );

    clip-path:
        polygon(
            50% 0,
            75% 20%,
            100% 100%,
            0 100%,
            25% 20%
        );
}

/* 마녀 모자 */
.witch-hat {
    position: absolute;

    left: 3px;
    top: 0;

    width: 80px;
    height: 12px;

    background: #21142d;

    border-radius: 50%;
}

.witch-hat::before {
    content: "";

    position: absolute;

    left: 22px;
    bottom: 3px;

    width: 38px;
    height: 45px;

    background: #21142d;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

/* 지휘봉 */
.wand {
    position: absolute;

    right: -12px;
    top: 50px;

    width: 65px;
    height: 5px;

    background: #3b2631;

    transform: rotate(-25deg);

    transform-origin: left center;

    border-radius: 5px;
}

.wand::after {
    content: "✦";

    position: absolute;

    right: -5px;
    top: -13px;

    color: #ffe46c;

    font-size: 25px;
}

/* 번개 */
.lightning {
    position: absolute;

    right: 24%;

    bottom: 70px;

    color: #fff17b;

    font-size: 55px;

    opacity: 0;

    transform: scale(.4);

    z-index: 10;

    pointer-events: none;
}

.lightning.attack {
    animation: lightningAttack .55s ease;
}

@keyframes lightningAttack {
    0% {
        opacity: 0;
        transform: translateX(0) scale(.4);
    }

    25% {
        opacity: 1;
        transform: translateX(-25px) scale(1);
    }

    60% {
        opacity: 1;
        transform: translateX(-70px) scale(1.1);
    }

    100% {
        opacity: 0;
        transform: translateX(-120px) scale(.5);
    }
}

/* 하트 공격 */
.heart.attack {
    animation: heartAttack .65s ease;
}

@keyframes heartAttack {
    0% {
        left: 12%;
    }

    50% {
        left: 62%;

        transform:
            rotate(-45deg)
            scale(1.15);
    }

    100% {
        left: 12%;
    }
}

/* 마녀 패배 */
.witch.defeated {
    animation: witchDefeat .7s ease forwards;
}

@keyframes witchDefeat {
    0% {
        transform: rotate(0) scale(1);
        opacity: 1;
    }

    50% {
        transform: rotate(25deg) scale(1.2);
    }

    100% {
        transform: rotate(-35deg) translateY(100px) scale(.3);
        opacity: 0;
    }
}

/* 상태 메시지 */
.message {
    min-height: 34px;

    text-align: center;

    margin-top: 6px;

    font-size: clamp(16px, 4.2vw, 22px);

    font-weight: 900;
}

/* 시작 화면 */
.start-screen {
    position: absolute;

    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 25px;

    text-align: center;

    background:
        linear-gradient(
            180deg,
            rgba(45,18,29,.96),
            rgba(84,31,48,.96)
        );
}

.start-heart {
    font-size: 90px;

    animation:
        floatHeart 1.8s ease-in-out infinite;
}

@keyframes floatHeart {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

.start-title {
    color: #fff2d5;

    font-size: clamp(30px, 8vw, 52px);

    font-weight: 900;

    margin: 8px 0;
}

.start-text {
    color: #ffe5c2;

    font-size: clamp(15px, 4vw, 20px);

    margin-bottom: 20px;
}

.start-btn {
    border: none;

    padding: 15px 32px;

    border-radius: 30px;

    background:
        linear-gradient(
            180deg,
            #ff7da8,
            #e9346e
        );

    color: white;

    font-size: clamp(17px, 4.5vw, 23px);

    font-weight: 900;

    box-shadow:
        0 6px 0 #942143;

    cursor: pointer;

    touch-action: manipulation;
}

.start-btn:active {
    transform: translateY(4px);

    box-shadow:
        0 2px 0 #942143;
}

/* 성공 / 복습 */
.overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        rgba(30,12,22,.88);
}

.overlay.show {
    display: flex;
}

.overlay-card {
    width: min(94vw, 620px);

    max-height: 92vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 28px;

    background: #fff8ed;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.4);
}

.success-heart {
    font-size: 100px;

    animation:
        successJump .7s infinite alternate;
}

@keyframes successJump {
    from {
        transform: scale(1) rotate(-5deg);
    }

    to {
        transform: scale(1.18) rotate(5deg);
    }
}

.overlay-title {
    font-size: clamp(30px, 8vw, 52px);

    font-weight: 900;

    color: #df2868;

    margin: 10px 0;
}

.review-title {
    font-size: clamp(22px, 6vw, 34px);

    font-weight: 900;

    color: #442631;

    margin-bottom: 8px;
}

.review-text {
    font-size: 16px;

    margin-bottom: 12px;
}

.review-staff {
    width: 100%;

    max-width: 550px;

    margin: 0 auto 15px;

    display: block;
}

.restart-btn {
    border: none;

    padding: 13px 25px;

    border-radius: 25px;

    background: #df2868;

    color: white;

    font-size: 18px;

    font-weight: 900;

    touch-action: manipulation;
}

/* 휴대폰 */
@media (max-width: 600px) {

    #app {
        padding: 0;
        align-items: stretch;
    }

    .theater {
        width: 100%;
        min-height: 100svh;

        border: none;

        border-radius: 0;
    }

    .ceiling {
        height: 80px;
    }

    .curtain {
        top: 60px;
        height: 34%;
        width: 11%;
    }

    .stage {
        left: 2%;
        right: 2%;
        bottom: 2%;

        height: 47%;
    }

    .header {
        padding-top: 20px;
    }

    .title {
        font-size: 30px;
    }

    .game-area {
        width: calc(100% - 20px);

        padding: 10px;

        border-radius: 20px;
    }

    .answers {
        grid-template-columns:
            repeat(4, 1fr);

        gap: 6px;
    }

    .answer-btn {
        min-height: 45px;

        padding: 5px 2px;

        font-size: 15px;
    }

    .character-zone {
        height: 105px;
    }

    .heart {
        width: 60px;
        height: 60px;
    }

    .heart::before,
    .heart::after {
        width: 60px;
        height: 60px;
    }

    .heart::before {
        top: -30px;
    }

    .heart::after {
        left: 30px;
    }

    .face {
        font-size: 18px;
    }

    .hat {
        top: -25px;

        width: 38px;
        height: 23px;
    }

    .hat::after {
        width: 53px;
    }

    .witch {
        transform: scale(.8);

        transform-origin: bottom right;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="theater">

        <div class="ceiling"></div>

        <div class="curtain left"></div>
        <div class="curtain right"></div>

        <div class="stage"></div>

        <div class="header">
            <h1 class="title">
                하트의 계이름 모험
            </h1>

            <div class="subtitle">
                음표를 보고 정확한 계이름을 맞혀보세요!
            </div>
        </div>

        <div class="score-board">

            <div class="score">
                정답 <span id="correctCount">0</span>회
            </div>

            <div class="score">
                실패 <span id="wrongCount">0</span>회
            </div>

        </div>

        <div class="game-area">

            <div class="question">
                이 음표의 계이름은?
            </div>

            <!--
                오선지
                C4 ~ C5
                도 레 미 파 솔 라 시 높은도
            -->
            <div class="staff-box">

                <svg
                    id="questionStaff"
                    class="staff"
                    viewBox="0 0 760 230"
                    preserveAspectRatio="xMidYMid meet">

                    <!-- 오선 -->
                    <g
                        stroke="#201820"
                        stroke-width="3"
                        fill="none">

                        <line x1="45" y1="55" x2="720" y2="55"/>
                        <line x1="45" y1="75" x2="720" y2="75"/>
                        <line x1="45" y1="95" x2="720" y2="95"/>
                        <line x1="45" y1="115" x2="720" y2="115"/>
                        <line x1="45" y1="135" x2="720" y2="135"/>

                    </g>

                    <!-- 마디선 -->
                    <line
                        x1="720"
                        y1="55"
                        x2="720"
                        y2="135"
                        stroke="#201820"
                        stroke-width="3"/>

                    <!-- 높은음자리표 -->
                    <text
                        x="43"
                        y="128"
                        font-family="serif"
                        font-size="105"
                        fill="#171217">
                        𝄞
                    </text>

                    <!-- 음표 -->
                    <g
                        id="note"
                        fill="#171217">
                    </g>

                </svg>

            </div>

            <div
                id="message"
                class="message">
            </div>

            <div class="character-zone">

                <!-- 하트 -->
                <div
                    id="heart"
                    class="heart">

                    <div class="hat"></div>

                    <div class="face">
                        ˶ᵔ ᵕ ᵔ˶
                    </div>

                </div>

                <!-- 마녀 -->
                <div
                    id="witch"
                    class="witch">

                    <div class="witch-hat"></div>

                    <div class="witch-head"></div>

                    <div class="witch-body"></div>

                    <div class="wand"></div>

                </div>

                <!-- 번개 -->
                <div
                    id="lightning"
                    class="lightning">
                    ⚡
                </div>

            </div>

            <div class="answers">

                <button class="answer-btn" data-note="도">
                    도
                </button>

                <button class="answer-btn" data-note="레">
                    레
                </button>

                <button class="answer-btn" data-note="미">
                    미
                </button>

                <button class="answer-btn" data-note="파">
                    파
                </button>

                <button class="answer-btn" data-note="솔">
                    솔
                </button>

                <button class="answer-btn" data-note="라">
                    라
                </button>

                <button class="answer-btn" data-note="시">
                    시
                </button>

                <button class="answer-btn" data-note="높은 도">
                    높은 도
                </button>

            </div>

        </div>

        <!-- 시작 화면 -->
        <div
            id="startScreen"
            class="start-screen">

            <div class="start-heart">
                💗
            </div>

            <div class="start-title">
                하트의 계이름 모험
            </div>

            <div class="start-text">
                음표를 보고 계이름을 맞혀<br>
                마녀를 물리쳐 주세요!
            </div>

            <button
                id="startBtn"
                class="start-btn">
                게임 시작 🎵
            </button>

        </div>

    </div>

</div>


<!-- 성공 / 복습 화면 -->

<div
    id="overlay"
    class="overlay">

    <div class="overlay-card">

        <div
            id="overlayContent">
        </div>

    </div>

</div>


<script>
/* =========================================================
   계이름 데이터

   사진과 동일하게
   도 → 레 → 미 → 파 → 솔 → 라 → 시 → 높은 도

   높은음자리표 기준
   ========================================================= */

const NOTES = [
    {
        name: "도",
        answer: "도",
        y: 155
    },
    {
        name: "레",
        answer: "레",
        y: 145
    },
    {
        name: "미",
        answer: "미",
        y: 135
    },
    {
        name: "파",
        answer: "파",
        y: 125
    },
    {
        name: "솔",
        answer: "솔",
        y: 115
    },
    {
        name: "라",
        answer: "라",
        y: 105
    },
    {
        name: "시",
        answer: "시",
        y: 95
    },
    {
        name: "높은 도",
        answer: "높은 도",
        y: 85
    }
];


/* =========================================================
   상태
   ========================================================= */

let currentNote = null;

let correct = 0;
let wrong = 0;

let playing = false;


/* =========================================================
   음표 위치

   높은음자리표 오선지 안에서
   사진과 같은 간격으로 표시
   ========================================================= */

const noteX = [
    105,
    180,
    255,
    330,
    405,
    480,
    555,
    630
];


/* =========================================================
   SVG 음표 그리기
   ========================================================= */

function drawNote(index) {

    const noteGroup =
        document.getElementById("note");

    noteGroup.innerHTML = "";

    const note = NOTES[index];

    const x = noteX[index];

    const y = note.y;

    /*
       음표 머리만 표시.
       이전 요청대로 음표 막대기는 사용하지 않는다.
    */

    const ellipse =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "ellipse"
        );

    ellipse.setAttribute(
        "cx",
        x
    );

    ellipse.setAttribute(
        "cy",
        y
    );

    ellipse.setAttribute(
        "rx",
        12
    );

    ellipse.setAttribute(
        "ry",
        8
    );

    ellipse.setAttribute(
        "transform",
        `rotate(-12 ${x} ${y})`
    );

    ellipse.setAttribute(
        "fill",
        "#171217"
    );

    noteGroup.appendChild(ellipse);


    /*
       도와 높은 도는 오선 밖이므로
       보조선을 정확하게 표시
    */

    if (index === 0) {

        const ledger =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        ledger.setAttribute(
            "x1",
            x - 20
        );

        ledger.setAttribute(
            "x2",
            x + 20
        );

        ledger.setAttribute(
            "y1",
            155
        );

        ledger.setAttribute(
            "y2",
            155
        );

        ledger.setAttribute(
            "stroke",
            "#171217"
        );

        ledger.setAttribute(
            "stroke-width",
            "3"
        );

        noteGroup.appendChild(ledger);
    }


    /*
       높은 도도 보조선
    */

    if (index === 7) {

        const ledger =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        ledger.setAttribute(
            "x1",
            x - 20
        );

        ledger.setAttribute(
            "x2",
            x + 20
        );

        ledger.setAttribute(
            "y1",
            85
        );

        ledger.setAttribute(
            "y2",
            85
        );

        ledger.setAttribute(
            "stroke",
            "#171217"
        );

        ledger.setAttribute(
            "stroke-width",
            "3"
        );

        noteGroup.appendChild(ledger);
    }
}


/* =========================================================
   새 문제
   ========================================================= */

function newQuestion() {

    const random =
        Math.floor(
            Math.random() * NOTES.length
        );

    currentNote = random;

    drawNote(random);

    document.getElementById(
        "message"
    ).textContent = "";
}


/* =========================================================
   점수 표시
   ========================================================= */

function updateScore() {

    document.getElementById(
        "correctCount"
    ).textContent = correct;

    document.getElementById(
        "wrongCount"
    ).textContent = wrong;
}


/* =========================================================
   버튼 활성화
   ========================================================= */

function setButtons(enabled) {

    document
        .querySelectorAll(".answer-btn")
        .forEach(btn => {

            btn.disabled = !enabled;

        });
}


/* =========================================================
   정답
   ========================================================= */

function correctAnswer() {

    correct++;

    updateScore();

    const heart =
        document.getElementById("heart");

    const witch =
        document.getElementById("witch");

    const message =
        document.getElementById("message");

    message.textContent =
        "정답! 하트가 마녀를 물리쳤어요! 💗";

    message.style.color = "#df2868";

    setButtons(false);

    heart.classList.remove("attack");

    witch.classList.remove("defeated");

    void heart.offsetWidth;

    heart.classList.add("attack");

    setTimeout(() => {

        witch.classList.add("defeated");

    }, 280);


    if (correct >= 5) {

        setTimeout(() => {

            showSuccess();

        }, 850);

        return;
    }


    setTimeout(() => {

        witch.classList.remove("defeated");

        newQuestion();

        setButtons(true);

    }, 1000);
}


/* =========================================================
   오답
   ========================================================= */

function wrongAnswer() {

    wrong++;

    updateScore();

    const message =
        document.getElementById("message");

    message.textContent =
        "앗! 마녀의 번개 공격! ⚡";

    message.style.color = "#7d2850";

    setButtons(false);


    const lightning =
        document.getElementById("lightning");

    lightning.classList.remove("attack");

    void lightning.offsetWidth;

    lightning.classList.add("attack");


    setTimeout(() => {

        message.textContent =
            "마녀와 꽝! 다시 도전해 보세요.";

    }, 400);


    /*
       실패 3회 → 복습
    */

    if (wrong >= 3) {

        setTimeout(() => {

            showReview();

        }, 850);

        return;
    }


    setTimeout(() => {

        newQuestion();

        setButtons(true);

    }, 1000);
}


/* =========================================================
   정답 버튼
   ========================================================= */

document
    .querySelectorAll(".answer-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                if (!playing) {
                    return;
                }

                const selected =
                    this.dataset.note;

                const answer =
                    NOTES[currentNote].answer;

                if (selected === answer) {

                    correctAnswer();

                } else {

                    wrongAnswer();

                }

            }
        );

    });

/* =========================================================
   배경음악

   외부 음악 파일을 사용하지 않고
   Web Audio API로 간단한 반복 멜로디 생성.

   아이폰 Safari에서는 사용자의 첫 터치 없이
   소리를 자동 재생할 수 없기 때문에
   "게임 시작" 터치 순간 AudioContext를 시작한다.
   ========================================================= */

let audioContext = null;

let masterGain = null;

let musicTimer = null;

let musicStarted = false;


/* 오디오 시작 */
function startMusic() {

    if (musicStarted) {
        return;
    }

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return;
        }

        audioContext =
            new AudioContext();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value = 0.055;

        masterGain.connect(
            audioContext.destination
        );

        musicStarted = true;

        playMelody();

    } catch (error) {

        console.log(
            "Audio unavailable",
            error
        );

    }
}


/* 멜로디 */
function playMelody() {

    if (!audioContext || !masterGain) {
        return;
    }

    const melody = [

        261.63, 293.66,
        329.63, 392.00,

        329.63, 293.66,
        261.63, 293.66,

        329.63, 392.00,
        440.00, 392.00,

        329.63, 293.66,
        261.63, 0

    ];

    let time =
        audioContext.currentTime + 0.05;

    melody.forEach(freq => {

        if (freq > 0) {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            osc.type = "sine";

            osc.frequency.value = freq;

            gain.gain.setValueAtTime(
                0,
                time
            );

            gain.gain.linearRampToValueAtTime(
                0.7,
                time + 0.03
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                time + 0.38
            );

            osc.connect(gain);

            gain.connect(masterGain);

            osc.start(time);

            osc.stop(time + 0.4);
        }

        time += 0.42;

    });


    musicTimer =
        setTimeout(
            playMelody,
            melody.length * 420 + 300
        );
}


/* 성공 효과음 */
function playSuccessSound() {

    if (!audioContext || !masterGain) {
        return;
    }

    const notes = [
        523.25,
        659.25,
        783.99,
        1046.50
    ];

    let time =
        audioContext.currentTime;

    notes.forEach((freq, i) => {

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type = "sine";

        osc.frequency.value = freq;

        gain.gain.setValueAtTime(
            0,
            time
        );

        gain.gain.linearRampToValueAtTime(
            0.25,
            time + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            time + 0.35
        );

        osc.connect(gain);

        gain.connect(masterGain);

        osc.start(time);

        osc.stop(time + 0.4);

        time += 0.18;
    });
}


/* =========================================================
   게임 시작

   중요:
   이 클릭 이벤트 안에서 음악을 시작하기 때문에
   아이폰 Safari에서도 정상적으로 소리가 난다.
   ========================================================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        async function() {

            startMusic();

            if (
                audioContext &&
                audioContext.state === "suspended"
            ) {

                await audioContext.resume();

            }

            document
                .getElementById("startScreen")
                .style.display = "none";

            playing = true;

            correct = 0;

            wrong = 0;

            updateScore();

            setButtons(true);

            newQuestion();

        },
        { passive: true }
    );


/* =========================================================
   첫 화면에서는 문제 버튼 잠금
   ========================================================= */

setButtons(false);


/* =========================================================
   화면 크기가 바뀌어도 SVG가 비율 유지
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        const staff =
            document.getElementById(
                "questionStaff"
            );

        if (staff) {

            staff.setAttribute(
                "preserveAspectRatio",
                "xMidYMid meet"
            );
        }

    }
);

</script>
