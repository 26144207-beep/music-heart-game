<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>하트의 계이름 모험</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: 'Jua', sans-serif;
    background: #17131f;
}

body {
    display: flex;
    justify-content: center;
}

#game {
    width: 100%;
    max-width: 900px;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.12), transparent 35%),
        linear-gradient(#30253e 0%, #17131f 100%);
    color: white;
}

/* 오페라 극장 */
.theater {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.ceiling {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #211923;
}

.stage {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 30%;
    background:
        linear-gradient(
            rgba(255,255,255,.04),
            rgba(0,0,0,.25)
        ),
        #3b1725;
}

.curtain {
    position: absolute;
    top: 50px;
    width: 19%;
    height: 55%;
    background:
        repeating-linear-gradient(
            90deg,
            #8b1730 0px,
            #681024 18px,
            #a9233e 35px
        );
}

.curtain.left {
    left: 0;
    border-radius: 0 0 70% 0;
}

.curtain.right {
    right: 0;
    border-radius: 0 0 0 70%;
}

.arch {
    position: absolute;
    top: 75px;
    left: 18%;
    right: 18%;
    height: 48%;
    border: 18px solid #9d7442;
    border-bottom: none;
    border-radius: 50% 50% 0 0;
}

.backstage {
    position: absolute;
    top: 105px;
    left: 22%;
    right: 22%;
    height: 42%;
    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(255,240,160,.7),
            transparent 28%
        ),
        linear-gradient(#25192c, #130f18);
}

/* 상단 UI */
.header {
    position: relative;
    z-index: 10;
    padding: 18px 16px 5px;
    text-align: center;
}

.title {
    margin: 0;
    font-size: clamp(28px, 7vw, 48px);
    color: #fff2a8;
    text-shadow:
        3px 3px 0 #7b2844,
        0 0 15px rgba(255,240,150,.4);
}

.info {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.badge {
    background: rgba(0,0,0,.42);
    border: 2px solid rgba(255,255,255,.2);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 16px;
}

/* 악보 */
.score-area {
    position: relative;
    z-index: 5;
    margin: 15px auto 8px;
    width: calc(100% - 24px);
    max-width: 820px;
    background: rgba(255,255,255,.96);
    border-radius: 18px;
    padding: 12px 8px;
    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

#staff {
    display: block;
    width: 100%;
    height: auto;
}

/*
    SVG 안의 실제 음 위치.

    오선:
    line 1 = y 65
    line 2 = y 80
    line 3 = y 95
    line 4 = y 110
    line 5 = y 125

    다장조 높은음자리표:
    도 = 아래 덧줄
    레 = 아래 첫째 칸
    미 = 첫째 줄
    파 = 첫째 칸
    솔 = 둘째 줄
    라 = 둘째 칸
    시 = 셋째 줄
    높은 도 = 셋째 칸

    단, 화면에서 오선과 음표가 정확히 겹쳐 보이도록
    아래 y 좌표를 직접 고정한다.
*/

/* 문제 */
.question {
    position: relative;
    z-index: 10;
    text-align: center;
    margin-top: 5px;
}

.question-text {
    font-size: clamp(20px, 5vw, 30px);
    color: #fff;
}

.answer-buttons {
    position: relative;
    z-index: 20;
    display: grid;
    grid-template-columns: repeat(4, minmax(60px, 1fr));
    gap: 9px;
    width: calc(100% - 28px);
    max-width: 650px;
    margin: 10px auto 20px;
}

.answer-buttons button {
    border: 0;
    border-radius: 18px;
    min-height: 58px;
    font-family: inherit;
    font-size: clamp(20px, 5vw, 29px);
    color: #4b2332;
    background: #fff5c7;
    box-shadow: 0 5px 0 #cba85a;
    cursor: pointer;
    touch-action: manipulation;
}

.answer-buttons button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #cba85a;
}

.answer-buttons button.correct {
    background: #b9f5b2;
}

.answer-buttons button.wrong {
    background: #ffaaa9;
}

.message {
    min-height: 35px;
    text-align: center;
    font-size: 22px;
    position: relative;
    z-index: 20;
}

/* 하트 */
.runner {
    position: absolute;
    z-index: 15;
    left: 8%;
    bottom: 23%;
    width: 90px;
    height: 100px;
    transition: left .55s ease;
}

.heart {
    position: absolute;
    left: 12px;
    bottom: 0;
    width: 62px;
    height: 62px;
    background: #ff527d;
    transform: rotate(-45deg);
    border-radius: 18px;
    box-shadow:
        0 5px 0 #b92e56,
        0 0 15px rgba(255,90,130,.5);
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 62px;
    height: 62px;
    background: #ff527d;
    border-radius: 50%;
}

.heart::before {
    top: -31px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 31px;
}

/* 모자 */
.hat {
    position: absolute;
    z-index: 3;
    top: 0;
    left: 8px;
    width: 70px;
    height: 34px;
    background: #49325f;
    border-radius: 50% 50% 15% 15%;
    transform: rotate(-7deg);
}

.hat::after {
    content: "";
    position: absolute;
    left: -9px;
    bottom: -7px;
    width: 88px;
    height: 12px;
    background: #362449;
    border-radius: 50%;
}

.star {
    position: absolute;
    z-index: 4;
    top: 5px;
    left: 30px;
    color: #ffe98b;
    font-size: 20px;
}

/* 마녀 */
.witch {
    position: absolute;
    z-index: 14;
    right: 9%;
    bottom: 22%;
    width: 100px;
    height: 130px;
    transition: transform .25s ease;
}

.witch-body {
    position: absolute;
    bottom: 0;
    left: 24px;
    width: 55px;
    height: 65px;
    background: #30203e;
    border-radius: 45% 45% 20% 20%;
}

.witch-head {
    position: absolute;
    top: 35px;
    left: 22px;
    width: 62px;
    height: 58px;
    background: #d89a91;
    border-radius: 50%;
    z-index: 3;
}

.witch-eye {
    position: absolute;
    top: 22px;
    width: 7px;
    height: 9px;
    background: #2a1725;
    border-radius: 50%;
}

.witch-eye.left {
    left: 16px;
}

.witch-eye.right {
    right: 16px;
}

.witch-hat {
    position: absolute;
    top: 0;
    left: 5px;
    width: 80px;
    height: 45px;
    background: #24182f;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.witch-hat::after {
    content: "";
    position: absolute;
    left: -13px;
    bottom: -5px;
    width: 105px;
    height: 14px;
    background: #24182f;
    border-radius: 50%;
}

.wand {
    position: absolute;
    right: -15px;
    top: 65px;
    width: 65px;
    height: 5px;
    background: #633d24;
    transform: rotate(-25deg);
    transform-origin: left center;
}

.wand::after {
    content: "✦";
    position: absolute;
    right: -15px;
    top: -17px;
    color: #fff17a;
    font-size: 28px;
}

/* 번개 */
.lightning {
    position: absolute;
    z-index: 16;
    right: 20%;
    bottom: 29%;
    font-size: 48px;
    color: #fff36b;
    opacity: 0;
    transform: scale(.3);
}

.lightning.show {
    animation: attack .55s ease forwards;
}

@keyframes attack {
    0% {
        opacity: 0;
        transform: translateX(0) scale(.3);
    }
    35% {
        opacity: 1;
        transform: translateX(-35px) scale(1.15);
    }
    100% {
        opacity: 0;
        transform: translateX(-80px) scale(.7);
    }
}

/* 성공/실패 */
.overlay {
    position: fixed;
    z-index: 100;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20,10,25,.88);
    padding: 20px;
}

.overlay.show {
    display: flex;
}

.panel {
    width: min(92vw, 620px);
    max-height: 90vh;
    overflow: auto;
    background: #fff8dc;
    color: #472537;
    border-radius: 28px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

.panel h2 {
    margin: 0 0 12px;
    font-size: clamp(36px, 10vw, 70px);
    color: #e04470;
}

.panel p {
    font-size: 22px;
    line-height: 1.5;
}

.review-score {
    margin: 15px auto;
    width: 100%;
    max-width: 560px;
}

.review-score svg {
    width: 100%;
    height: auto;
}

.restart {
    border: 0;
    border-radius: 16px;
    padding: 13px 28px;
    background: #ff6389;
    color: white;
    font-family: inherit;
    font-size: 22px;
    cursor: pointer;
}

/* 성공 하트 */
.big-heart {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 15px auto 25px;
    background: #ff4f82;
    transform: rotate(-45deg);
    border-radius: 25px;
    animation: happy .65s infinite alternate;
}

.big-heart::before,
.big-heart::after {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    background: #ff4f82;
    border-radius: 50%;
}

.big-heart::before {
    top: -65px;
    left: 0;
}

.big-heart::after {
    top: 0;
    left: 65px;
}

@keyframes happy {
    from {
        transform: rotate(-45deg) scale(1);
    }
    to {
        transform: rotate(-45deg) scale(1.12);
    }
}

/* 모바일 */
@media (max-width: 600px) {

    .header {
        padding-top: 12px;
    }

    .title {
        font-size: 29px;
    }

    .score-area {
        width: calc(100% - 12px);
        padding: 8px 4px;
        margin-top: 10px;
    }

    .answer-buttons {
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        width: calc(100% - 18px);
    }

    .answer-buttons button {
        min-height: 54px;
        font-size: 20px;
        border-radius: 15px;
    }

    .runner {
        transform: scale(.72);
        transform-origin: bottom left;
    }

    .witch {
        transform: scale(.72);
        transform-origin: bottom right;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="theater">
        <div class="ceiling"></div>
        <div class="curtain left"></div>
        <div class="curtain right"></div>
        <div class="arch"></div>
        <div class="backstage"></div>
        <div class="stage"></div>
    </div>

    <header class="header">
        <h1 class="title">🎼 하트의 계이름 모험 💕</h1>

        <div class="info">
            <div class="badge">
                정답 <span id="correctCount">0</span>회
            </div>

            <div class="badge">
                실패 <span id="wrongCount">0</span>회
            </div>
        </div>
    </header>


    <!-- 오선 -->
    <div class="score-area">

        <svg id="staff"
             viewBox="0 0 820 210"
             preserveAspectRatio="xMidYMid meet">

            <!-- 오선 -->
            <g stroke="#151515"
               stroke-width="2.4"
               fill="none">

                <line x1="35" y1="65" x2="790" y2="65"/>
                <line x1="35" y1="80" x2="790" y2="80"/>
                <line x1="35" y1="95" x2="790" y2="95"/>
                <line x1="35" y1="110" x2="790" y2="110"/>
                <line x1="35" y1="125" x2="790" y2="125"/>

            </g>


            <!-- 높은음자리표 -->
            <text x="39"
                  y="125"
                  font-family="serif"
                  font-size="105"
                  font-weight="normal"
                  fill="#111">
                𝄞
            </text>


            <!-- 아래 덧줄 -->
            <line id="ledger"
                  x1="70"
                  y1="140"
                  x2="120"
                  y2="140"
                  stroke="#111"
                  stroke-width="2.4"/>


            <!-- 현재 음표 -->
            <ellipse id="note"
                     cx="95"
                     cy="140"
                     rx="13"
                     ry="9"
                     fill="white"
                     stroke="#111"
                     stroke-width="3"/>

        </svg>

    </div>


    <div class="question">
        <div class="question-text">
            이 음표의 계이름은?
        </div>
    </div>


    <div id="message" class="message">
        음표를 보고 정답을 눌러주세요!
    </div>


    <!-- 하트 -->
    <div class="runner" id="runner">

        <div class="hat">
            <div class="star">★</div>
        </div>

        <div class="heart"></div>

    </div>


    <!-- 마녀 -->
    <div class="witch" id="witch">

        <div class="witch-hat"></div>

        <div class="witch-head">
            <div class="witch-eye left"></div>
            <div class="witch-eye right"></div>
        </div>

        <div class="witch-body"></div>

        <div class="wand"></div>

    </div>


    <div class="lightning" id="lightning">
        ⚡
    </div>


    <!-- 정답 -->
    <div class="answer-buttons">

        <button onclick="answer('도')">도</button>
        <button onclick="answer('레')">레</button>
        <button onclick="answer('미')">미</button>
        <button onclick="answer('파')">파</button>

        <button onclick="answer('솔')">솔</button>
        <button onclick="answer('라')">라</button>
        <button onclick="answer('시')">시</button>
        <button onclick="answer('높은 도')">높은 도</button>

    </div>


    <!-- 결과 화면 -->
    <div class="overlay" id="overlay">

        <div class="panel" id="panel"></div>

    </div>

</div>


<script>

/*
=========================================================
음계 데이터

사진 기준:

도      : 아래 덧줄
레      : 아래 첫째 칸
미      : 첫째 줄
파      : 첫째 칸
솔      : 둘째 줄
라      : 둘째 칸
시      : 셋째 줄
높은 도 : 셋째 칸

오선 간격 = 15
=========================================================
*/

const NOTES = [
    {
        name: "도",
        y: 140
    },
    {
        name: "레",
        y: 132.5
    },
    {
        name: "미",
        y: 125
    },
    {
        name: "파",
        y: 117.5
    },
    {
        name: "솔",
        y: 110
    },
    {
        name: "라",
        y: 102.5
    },
    {
        name: "시",
        y: 95
    },
    {
        name: "높은 도",
        y: 87.5
    }
];


/*
문제는 위 8개의 음만 사용한다.
*/

let currentNote = null;

let correctCount = 0;
let wrongCount = 0;

const note = document.getElementById("note");
const ledger = document.getElementById("ledger");

const message = document.getElementById("message");

const correctCountText =
    document.getElementById("correctCount");

const wrongCountText =
    document.getElementById("wrongCount");

const runner =
    document.getElementById("runner");

const witch =
    document.getElementById("witch");

const lightning =
    document.getElementById("lightning");

const overlay =
    document.getElementById("overlay");

const panel =
    document.getElementById("panel");


/*
새 문제
*/

function newQuestion() {

    const index =
        Math.floor(Math.random() * NOTES.length);

    currentNote = NOTES[index];

    note.setAttribute(
        "cy",
        currentNote.y
    );


    /*
    도는 아래 덧줄이 필요하다.
    */

    if (currentNote.name === "도") {

        ledger.setAttribute(
            "x1",
            "70"
        );

        ledger.setAttribute(
            "x2",
            "120"
        );

        ledger.setAttribute(
            "y1",
            currentNote.y
        );

        ledger.setAttribute(
            "y2",
            currentNote.y
        );

        ledger.style.display = "block";

    } else {

        ledger.style.display = "none";

    }

}


/*
정답 확인
*/

function answer(userAnswer) {

    if (!currentNote) return;


    if (userAnswer === currentNote.name) {

        correct();

    } else {

        wrong();

    }

}


/*
정답
*/

function correct() {

    correctCount++;

    correctCountText.textContent =
        correctCount;

    message.textContent =
        "정답! ✨ 마녀를 물리쳤어!";

    message.style.color =
        "#baffae";


    /*
    하트가 마녀에게 돌진
    */

    runner.style.left = "67%";


    setTimeout(() => {

        witch.style.transform =
            "scale(.7) rotate(20deg)";

        lightning.classList.remove("show");

    }, 350);


    /*
    5회 이상 정답이면 성공
    */

    if (correctCount >= 5) {

        setTimeout(showSuccess, 650);

    } else {

        setTimeout(() => {

            runner.style.left = "8%";

            witch.style.transform =
                "scale(1)";

            newQuestion();

            message.textContent =
                "다음 음표를 맞혀보세요!";

            message.style.color =
                "white";

        }, 800);

    }

}


/*
오답
*/

function wrong() {

    wrongCount++;

    wrongCountText.textContent =
        wrongCount;

    message.textContent =
        "오답! 마녀와 꽝! 💥";

    message.style.color =
        "#ff9e9e";


    /*
    마녀가 번개 공격
    */

    lightning.classList.remove("show");

    void lightning.offsetWidth;

    lightning.classList.add("show");


    /*
    하트와 마녀 충돌
    */

    runner.style.left = "67%";

    setTimeout(() => {

        runner.style.left = "54%";

        witch.style.transform =
            "rotate(-12deg) scale(1.08)";

    }, 350);


    /*
    실패 3회
    */

    if (wrongCount >= 3) {

        setTimeout(showReview, 750);

    } else {

        setTimeout(() => {

            runner.style.left = "8%";

            witch.style.transform =
                "scale(1)";

            newQuestion();

            message.textContent =
                "다시 도전해보세요!";

            message.style.color =
                "white";

        }, 1000);

    }

}


/*
성공 화면
*/

function showSuccess() {

    overlay.classList.add("show");

    panel.innerHTML = `

        <div class="big-heart"></div>

        <h2>성공!</h2>

        <p>
            모든 마녀를 물리치고<br>
            계이름 모험을 성공했어! 🎉
        </p>

        <p>
            정답 <strong>${correctCount}</strong>회
        </p>

        <button class="restart"
                onclick="restartGame()">
            다시 시작
        </button>
    `;

}


/*
3회 실패 → 계이름 복습
*/

function showReview() {

    overlay.classList.add("show");

    panel.innerHTML = `

        <h2 style="font-size:42px">
            계이름 복습 📖
        </h2>

        <p>
            3번 틀렸어!
        </p>

        <p>
            아래 오선에서 계이름 위치를 다시 확인해보자.
        </p>

        <div class="review-score">

            <svg viewBox="0 0 820 210">

                <!-- 오선 -->

                <g stroke="#111"
                   stroke-width="2.4">

                    <line x1="35" y1="65"
                          x2="790" y2="65"/>

                    <line x1="35" y1="80"
                          x2="790" y2="80"/>

                    <line x1="35" y1="95"
                          x2="790" y2="95"/>

                    <line x1="35" y1="110"
                          x2="790" y2="110"/>

                    <line x1="35" y1="125"
                          x2="790" y2="125"/>

                </g>


                <!-- 높은음자리표 -->

                <text x="39"
                      y="125"
                      font-family="serif"
                      font-size="105"
                      fill="#111">
                    𝄞
                </text>


                <!-- 도 -->

                <line x1="70"
                      y1="140"
                      x2="120"
                      y2="140"
                      stroke="#111"
                      stroke-width="2.4"/>

                <ellipse cx="95"
                         cy="140"

/*

*/

function restartGame() {

    correctCount = 0;
    wrongCount = 0;

    correctCountText.textContent = "0";
    wrongCountText.textContent = "0";

    runner.style.left = "8%";

    witch.style.transform =
        "scale(1)";

    lightning.classList.remove("show");

    overlay.classList.remove("show");

    message.textContent =
        "음표를 보고 정답을 눌러주세요!";

    message.style.color =
        "white";

    newQuestion();

}
