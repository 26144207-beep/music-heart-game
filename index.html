<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#241827">

<title>하트의 계이름 모험</title>

<style>

/* =====================================================
   기본 설정
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #19131d;
    color: #ffffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    overflow-x: hidden;
}

button {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}


/* =====================================================
   게임 전체
===================================================== */

#game {
    position: relative;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #30223a 0%,
            #211923 55%,
            #171119 100%
        );
}


/* =====================================================
   오페라 극장 배경
===================================================== */

.theater {
    position: absolute;
    inset: 0;

    pointer-events: none;
}


/* 천장 */

.ceiling {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 55px;

    background: #181219;
}


/* 무대 */

.stage {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 28%;

    background:
        linear-gradient(
            rgba(255,255,255,.04),
            rgba(0,0,0,.3)
        ),
        #421b2a;
}


/* 커튼 */

.curtain {
    position: absolute;

    top: 45px;

    width: 18%;
    height: 52%;

    background:
        repeating-linear-gradient(
            90deg,
            #7d1630 0px,
            #681126 14px,
            #9d1e3d 28px
        );
}

.curtain.left {
    left: 0;

    border-radius:
        0 0 70% 0;
}

.curtain.right {
    right: 0;

    border-radius:
        0 0 0 70%;
}


/* 중앙 아치 */

.arch {
    position: absolute;

    top: 65px;
    left: 17%;
    right: 17%;

    height: 46%;

    border:
        12px solid #9b7040;

    border-bottom: none;

    border-radius:
        50% 50% 0 0;
}


/* 무대 안쪽 */

.backstage {
    position: absolute;

    top: 90px;
    left: 21%;
    right: 21%;

    height: 42%;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,239,160,.55),
            transparent 27%
        ),
        #18131d;
}


/* =====================================================
   상단 제목
===================================================== */

.header {
    position: relative;

    z-index: 20;

    padding:
        max(12px, env(safe-area-inset-top))
        12px
        4px;

    text-align: center;
}

.title {
    margin: 0;

    font-size: clamp(
        24px,
        7vw,
        43px
    );

    font-weight: 800;

    color: #fff0a6;

    text-shadow:
        2px 2px 0 #692b45;
}

.info {
    margin-top: 8px;

    display: flex;

    justify-content: center;

    gap: 7px;

    flex-wrap: wrap;
}

.badge {
    padding: 5px 12px;

    border-radius: 30px;

    background:
        rgba(0,0,0,.42);

    border:
        1px solid
        rgba(255,255,255,.2);

    font-size: 14px;
}


/* =====================================================
   시작 버튼
===================================================== */

.start-screen {
    position: fixed;

    z-index: 200;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(20,12,24,.96);
}

.start-box {
    width: min(
        90vw,
        520px
    );

    padding: 30px 20px;

    text-align: center;

    border-radius: 26px;

    background: #fff7dc;

    color: #472536;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);
}

.start-box h1 {
    margin: 0 0 12px;

    font-size:
        clamp(30px, 8vw, 48px);

    color: #d9436b;
}

.start-box p {
    margin: 8px 0;

    font-size:
        clamp(17px, 4.5vw, 21px);

    line-height: 1.5;
}

.start-button {
    margin-top: 18px;

    border: none;

    border-radius: 18px;

    padding:
        15px 30px;

    font-size: 23px;

    font-weight: 700;

    color: white;

    background: #ef527c;

    box-shadow:
        0 5px 0 #b83258;

    cursor: pointer;

    touch-action: manipulation;
}

.start-button:active {
    transform: translateY(4px);

    box-shadow:
        0 1px 0 #b83258;
}


/* =====================================================
   오선
===================================================== */

.score-area {
    position: relative;

    z-index: 10;

    width:
        calc(100% - 12px);

    max-width: 820px;

    margin:
        10px auto 8px;

    padding: 5px;

    border-radius: 16px;

    background: #fff;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.4);
}

#staff {
    display: block;

    width: 100%;

    height: auto;
}


/* =====================================================
   문제
===================================================== */

.question {
    position: relative;

    z-index: 30;

    text-align: center;
}

.question-text {
    font-size:
        clamp(19px, 5vw, 28px);

    font-weight: 700;
}

.message {
    position: relative;

    z-index: 30;

    min-height: 32px;

    padding:
        2px 10px;

    text-align: center;

    font-size:
        clamp(17px, 4.5vw, 23px);
}


/* =====================================================
   정답 버튼
===================================================== */

.answer-buttons {
    position: relative;

    z-index: 40;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    width:
        calc(100% - 16px);

    max-width: 650px;

    margin:
        7px auto 18px;
}

.answer-buttons button {
    min-height: 52px;

    border: none;

    border-radius: 15px;

    background: #fff2bd;

    color: #492437;

    font-size:
        clamp(17px, 4.8vw, 25px);

    font-weight: 700;

    box-shadow:
        0 4px 0 #c9a44f;

    cursor: pointer;

    touch-action: manipulation;
}

.answer-buttons button:active {
    transform: translateY(3px);

    box-shadow:
        0 1px 0 #c9a44f;
}


/* =====================================================
   하트
===================================================== */

.runner {
    position: absolute;

    z-index: 25;

    left: 6%;
    bottom: 21%;

    width: 75px;
    height: 95px;

    transition:
        left .55s ease;
}

.heart {
    position: absolute;

    left: 8px;
    bottom: 0;

    width: 58px;
    height: 58px;

    background: #ff527f;

    transform:
        rotate(-45deg);

    border-radius:
        16px;

    box-shadow:
        0 5px 0 #b82f58;
}

.heart::before,
.heart::after {
    content: "";

    position: absolute;

    width: 58px;
    height: 58px;

    background: #ff527f;

    border-radius: 50%;
}

.heart::before {
    top: -29px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 29px;
}


/* 모자 */

.hat {
    position: absolute;

    z-index: 4;

    top: 0;
    left: 2px;

    width: 67px;
    height: 32px;

    background: #47305b;

    border-radius:
        50% 50% 10% 10%;

    transform:
        rotate(-7deg);
}

.hat::after {
    content: "";

    position: absolute;

    left: -8px;
    bottom: -6px;

    width: 83px;
    height: 11px;

    border-radius: 50%;

    background: #332343;
}

.star {
    position: absolute;

    top: 4px;
    left: 29px;

    color: #ffe888;

    font-size: 17px;
}


/* =====================================================
   마녀
===================================================== */

.witch {
    position: absolute;

    z-index: 24;

    right: 7%;
    bottom: 20%;

    width: 90px;
    height: 125px;

    transition:
        transform .25s ease;
}

.witch-hat {
    position: absolute;

    z-index: 5;

    top: 0;
    left: 6px;

    width: 74px;
    height: 46px;

    background: #24172e;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

.witch-hat::after {
    content: "";

    position: absolute;

    left: -10px;
    bottom: -5px;

    width: 94px;
    height: 13px;

    background: #24172e;

    border-radius: 50%;
}

.witch-head {
    position: absolute;

    z-index: 4;

    top: 36px;
    left: 18px;

    width: 57px;
    height: 54px;

    background: #d79a91;

    border-radius: 50%;
}

.witch-eye {
    position: absolute;

    top: 21px;

    width: 6px;
    height: 8px;

    border-radius: 50%;

    background: #241622;
}

.witch-eye.left {
    left: 15px;
}

.witch-eye.right {
    right: 15px;
}

.witch-body {
    position: absolute;

    bottom: 0;
    left: 19px;

    width: 57px;
    height: 62px;

    background: #30203c;

    border-radius:
        45% 45% 18% 18%;
}

.wand {
    position: absolute;

    z-index: 8;

    top: 66px;
    right: -12px;

    width: 65px;
    height: 4px;

    background: #70472a;

    transform:
        rotate(-25deg);

    transform-origin:
        left center;
}

.wand::after {
    content: "★";

    position: absolute;

    right: -12px;
    top: -14px;

    color: #fff16c;

    font-size: 25px;
}


/* =====================================================
   번개
===================================================== */

.lightning {
    position: absolute;

    z-index: 50;

    right: 20%;
    bottom: 29%;

    color: #fff16a;

    font-size: 45px;

    opacity: 0;

    pointer-events: none;
}

.lightning.show {
    animation:
        lightningAttack
        .6s ease forwards;
}

@keyframes lightningAttack {

    0% {
        opacity: 0;

        transform:
            translateX(0)
            scale(.3);
    }

    35% {
        opacity: 1;

        transform:
            translateX(-35px)
            scale(1.1);
    }

    100% {
        opacity: 0;

        transform:
            translateX(-85px)
            scale(.7);
    }
}


/* =====================================================
   결과 화면
===================================================== */

.overlay {
    position: fixed;

    z-index: 150;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
        rgba(20,10,25,.92);
}

.overlay.show {
    display: flex;
}

.panel {
    width:
        min(92vw, 600px);

    max-height: 90vh;

    overflow-y: auto;

    padding:
        25px 17px;

    text-align: center;

    border-radius: 25px;

    background: #fff7dc;

    color: #472536;
}

.panel h2 {
    margin:
        0 0 10px;

    font-size:
        clamp(38px, 11vw, 68px);

    color: #e04370;
}

.panel p {
    font-size:
        clamp(18px, 5vw, 23px);

    line-height: 1.5;
}

.restart {
    border: none;

    border-radius: 16px;

    padding:
        13px 27px;

    background: #ed537d;

    color: white;

    font-size: 21px;

    font-weight: 700;

    cursor: pointer;
}


/* 성공 하트 */

.big-heart {
    position: relative;

    width: 105px;
    height: 105px;

    margin:
        20px auto 35px;

    background: #ff527f;

    transform:
        rotate(-45deg);

    border-radius: 22px;

    animation:
        happy .65s
        infinite alternate;
}

.big-heart::before,
.big-heart::after {
    content: "";

    position: absolute;

    width: 105px;
    height: 105px;

    background: #ff527f;

    border-radius: 50%;
}

.big-heart::before {
    top: -52px;
    left: 0;
}

.big-heart::after {
    top: 0;
    left: 52px;
}

@keyframes happy {

    from {
        transform:
            rotate(-45deg)
            scale(1);
    }

    to {
        transform:
            rotate(-45deg)
            scale(1.12);
    }
}


/* =====================================================
   복습 악보
===================================================== */

.review-score {
    width: 100%;

    margin:
        12px auto;
}

.review-score svg {
    display: block;

    width: 100%;
    height: auto;
}


/* =====================================================
   모바일
===================================================== */

@media (max-width: 600px) {

    .title {
        font-size: 27px;
    }

    .score-area {
        margin-top: 7px;
    }

    .answer-buttons {
        gap: 6px;
    }

    .answer-buttons button {
        min-height: 50px;

        border-radius: 13px;

        font-size: 18px;
    }

    .runner {
        transform:
            scale(.72);

        transform-origin:
            bottom left;
    }

    .witch {
        transform:
            scale(.72);

        transform-origin:
            bottom right;
    }
}

</style>
</head>


<body>

<div id="game">


    <!-- =================================================
         배경
    ================================================= -->

    <div class="theater">

        <div class="ceiling"></div>

        <div class="curtain left"></div>

        <div class="curtain right"></div>

        <div class="arch"></div>

        <div class="backstage"></div>

        <div class="stage"></div>

    </div>


    <!-- =================================================
         시작 화면

         중요:
         이 버튼을 누를 때 AudioContext를 시작한다.
         iPhone Safari의 사용자 동작 제한을 피하기 위한 구조.
    ================================================= -->

    <div
        class="start-screen"
        id="startScreen">

        <div class="start-box">

            <h1>
                하트의<br>
                계이름 모험
            </h1>

            <p>
                음표를 보고<br>
                정확한 계이름을 맞혀보세요!
            </p>

            <p>
                🎵 정답이면 마녀 물리치기<br>
                ⚡ 틀리면 마녀의 번개 공격
            </p>

            <button
                class="start-button"
                id="startButton">

                게임 시작 🎵

            </button>

        </div>

    </div>


    <!-- =================================================
         제목
    ================================================= -->

    <header class="header">

        <h1 class="title">
            하트의 계이름 모험
        </h1>

        <div class="info">

            <div class="badge">
                정답
                <span id="correctCount">
                    0
                </span>
                회
            </div>

            <div class="badge">
                실패
                <span id="wrongCount">
                    0
                </span>
                회
            </div>

        </div>

    </header>


    <!-- =================================================
         악보
    ================================================= -->

    <div class="score-area">

        <svg
            id="staff"
            viewBox="0 0 820 210"
            preserveAspectRatio="xMidYMid meet">


            <!-- 오선 -->

            <g
                stroke="#111"
                stroke-width="2.5">

                <line
                    x1="35"
                    y1="65"
                    x2="790"
                    y2="65"/>

                <line
                    x1="35"
                    y1="80"
                    x2="790"
                    y2="80"/>

                <line
                    x1="35"
                    y1="95"
                    x2="790"
                    y2="95"/>

                <line
                    x1="35"
                    y1="110"
                    x2="790"
                    y2="110"/>

                <line
                    x1="35"
                    y1="125"
                    x2="790"
                    y2="125"/>

            </g>


            <!-- 높은음자리표 -->

            <text
                x="38"
                y="126"
                font-family="Times New Roman, serif"
                font-size="104"
                fill="#111">

                𝄞

            </text>


            <!-- 도 아래 덧줄 -->

            <line
                id="ledger"
                x1="70"
                y1="140"
                x2="120"
                y2="140"
                stroke="#111"
                stroke-width="2.5"/>


            <!-- 음표 -->

            <ellipse
                id="note"
                cx="95"
                cy="140"
                rx="13"
                ry="9"
                fill="#ffffff"
                stroke="#111"
                stroke-width="3"/>


        </svg>

    </div>


    <!-- =================================================
         문제
    ================================================= -->

    <div class="question">

        <div class="question-text">

            이 음표의 계이름은?

        </div>

    </div>


    <div
        class="message"
        id="message">

        게임을 시작해주세요!

    </div>


    <!-- =================================================
         하트
    ================================================= -->

    <div
        class="runner"
        id="runner">

        <div class="hat">

            <div class="star">
                ★
            </div>

        </div>

        <div class="heart"></div>

    </div>


    <!-- =================================================
         마녀
    ================================================= -->

    <div
        class="witch"
        id="witch">

        <div class="witch-hat"></div>

        <div class="witch-head">

            <div
                class="witch-eye left">
            </div>

            <div
                class="witch-eye right">
            </div>

        </div>

        <div class="witch-body"></div>

        <div class="wand"></div>

    </div>


    <!-- 번개 -->

    <div
        class="lightning"
        id="lightning">

        ⚡

    </div>


    <!-- =================================================
         정답 버튼
    ================================================= -->

    <div class="answer-buttons">

        <button data-answer="도">
            도
        </button>

        <button data-answer="레">
            레
        </button>

        <button data-answer="미">
            미
        </button>

        <button data-answer="파">
            파
        </button>

        <button data-answer="솔">
            솔
        </button>

        <button data-answer="라">
            라
        </button>

        <button data-answer="시">
            시
        </button>

        <button data-answer="높은 도">
            높은 도
        </button>

    </div>


    <!-- =================================================
         결과
    ================================================= -->

    <div
        class="overlay"
        id="overlay">

        <div
            class="panel"
            id="panel">
        </div>

    </div>


</div>


<script>

/* =====================================================
   음계

   사진 기준으로 고정.

   오선:
   65
   80
   95
   110
   125

   도 = 140
   레 = 132.5
   미 = 125
   파 = 117.5
   솔 = 110
   라 = 102.5
   시 = 95
   높은 도 = 87.5
===================================================== */

const NOTES = [

    {
        name: "도",
        y: 140
    },

    {
        name: "레",
        y: 132.5
    },

    {
        name: "미",
        y: 125
    },

    {
        name: "파",
        y: 117.5
    },

    {
        name: "솔",
        y: 110
    },

    {
        name: "라",
        y: 102.5
    },

    {
        name: "시",
        y: 95
    },

    {
        name: "높은 도",
        y: 87.5
    }

];


/* =====================================================
   게임 상태
===================================================== */

let currentNote = null;

let correctCount = 0;

let wrongCount = 0;

let gameStarted = false;


/* =====================================================
   HTML 요소
===================================================== */

const note =
    document.getElementById("note");

const ledger =
    document.getElementById("ledger");

const runner =
    document.getElementById("runner");

const witch =
    document.getElementById("witch");

const lightning =
    document.getElementById("lightning");

const message =
    document.getElementById("message");

const correctCountText =
    document.getElementById("correctCount");

const wrongCountText =
    document.getElementById("wrongCount");

const overlay =
    document.getElementById("overlay");

const panel =
    document.getElementById("panel");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");


/* =====================================================
   배경음악
=====================================================

   외부 mp3 파일을 사용하지 않는다.

   Web Audio API로 간단한 피아노풍 음을 생성한다.

   장점:
   - GitHub에 음악 파일 업로드 필요 없음
   - 아이폰에서도 같은 HTML 안에서 실행 가능
   - 시작 버튼을 누른 사용자 동작 안에서 AudioContext 시작
===================================================== */

let audioContext = null;

let masterGain = null;

let musicTimer = null;

let musicPlaying = false;


/* 코드 진행 */

const chords = [

    [261.63, 329.63, 392.00],

    [196.00, 246.94, 293.66],

    [220.00, 277.18, 329.63],

    [174.61, 220.00, 261.63]

];


/* 오디오 시작 */

function startMusic() {

    try {

        if (!audioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            audioContext =
                new AudioContext();

            masterGain =
                audioContext.createGain();

            masterGain.gain.value =
                0.055;

            masterGain.connect(
                audioContext.destination
            );
        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }


        if (!musicPlaying) {

            musicPlaying = true;

            playMusicLoop();

        }

    } catch (error) {

        console.log(
            "Audio unavailable:",
            error
        );

    }

}


/* 피아노풍 음 */

function playTone(
    frequency,
    duration,
    startTime
) {

    if (!audioContext) return;


    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    osc.type = "sine";

    osc.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        0.0001,
        startTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.13,
        startTime + 0.03
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        startTime + duration
    );


    osc.connect(gain);

    gain.connect(masterGain);


    osc.start(startTime);

    osc.stop(
        startTime + duration + 0.05
    );

}


/* 배경음 반복 */

function playMusicLoop() {

    if (
        !musicPlaying ||
        !audioContext
    ) return;


    const now =
        audioContext.currentTime;


    chords.forEach(
        (chord, index) => {

            const time =
                now + index * 1.5;


            /* 낮은 화음 */

            playTone(
                chord[0],
                1.25,
                time
            );


            /* 중간음 */

            playTone(
                chord[1],
                1.15,
                time + 0.18
            );


            /* 높은음 */

            playTone(
                chord[2],
                1.05,
                time + 0.36
            );

        }
    );


    musicTimer =
        setTimeout(
            playMusicLoop,
            5800
        );

}


/* 음악 정지 */

function stopMusic() {

    musicPlaying = false;

    if (musicTimer) {

        clearTimeout(
            musicTimer
        );

        musicTimer = null;

    }

}


/* =====================================================
   문제 만들기
===================================================== */

function newQuestion() {

    const randomIndex =
        Math.floor(
            Math.random() *
            NOTES.length
        );


    currentNote =
        NOTES[randomIndex];


    note.setAttribute(
        "cy",
        currentNote.y
    );


    /*
      도일 때만 아래 덧줄.
    */

    if (
        currentNote.name === "도"
    ) {

        ledger.style.display =
            "block";

        ledger.setAttribute(
            "y1",
            currentNote.y
        );

        ledger.setAttribute(
            "y2",
            currentNote.y
        );

    } else {

        ledger.style.display =
            "none";

    }

}


/* =====================================================
   시작
===================================================== */

startButton.addEventListener(
    "click",
    function() {

        /*
          이 클릭 이벤트 안에서
          AudioContext를 시작한다.
        */

        startMusic();

        gameStarted = true;

        startScreen.style.display =
            "none";

        message.textContent =
            "음표를 보고 정답을 눌러주세요!";

        newQuestion();

    }
);


/* =====================================================
   답 버튼
===================================================== */

const answerButtons =
    document.querySelectorAll(
        ".answer-buttons button"
    );


answerButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                if (!gameStarted) {
                    return;
                }


                const answer =
                    this.dataset.answer;


                checkAnswer(answer);

            }
        );

    }
);


/* =====================================================
   정답 확인
===================================================== */

function checkAnswer(answer) {

    if (!currentNote) {
        return;
    }


    if (
        answer === currentNote.name
    ) {

        correct();

    } else {

        wrong();

    }

}


/* =====================================================
   정답
===================================================== */

function correct() {

    correctCount++;

    correctCountText.textContent =
        correctCount;


    message.textContent =
        "정답! 마녀를 물리쳤어! ✨";


    message.style.color =
        "#b9ffad";


    /*
      하트가 마녀에게 돌진.
    */

    runner.style.left =
        "68%";


    setTimeout(
        function() {

            witch.style.transform =
                "rotate(20deg) scale(.75)";

        },
        300
    );


    /*
      5회 성공
    */

    if (
        correctCount >= 5
    ) {

        setTimeout(
            showSuccess,
            750
        );

        return;
    }


    setTimeout(
        function() {

            runner.style.left =
                "6%";

            witch.style.transform =
                "scale(1)";

            message.style.color =
                "white";

            message.textContent =
                "다음 음표!";

            newQuestion();

        },
        850
    );

}


/* =====================================================
   오답
===================================================== */

function wrong() {

    wrongCount++;

    wrongCountText.textContent =
        wrongCount;


    message.textContent =
        "오답! 마녀와 꽝! 💥";


    message.style.color =
        "#ffaaaa";


    /*
      번개 공격.
    */

    lightning.classList.remove(
        "show"
    );


    void lightning.offsetWidth;


    lightning.classList.add(
        "show"
    );


    /*
      하트와 마녀 충돌.
    */

    runner.style.left =
        "67%";


    setTimeout(
        function() {

            witch.style.transform =
                "rotate(-12deg) scale(1.1)";

        },
        300
    );


    /*
      3회 실패하면 복습.
    */

    if (
        wrongCount >= 3
    ) {

        setTimeout(
            showReview,
            750
        );

        return;
    }


    setTimeout(
        function() {

            runner.style.left =
                "6%";

            witch.style.transform =
                "scale(1)";

            message.style.color =
                "white";

            newQuestion();

        },
        1000
    );

}
