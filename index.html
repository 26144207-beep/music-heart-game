<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>모자 쓴 하트의 계이름 모험</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family:
        "Arial Rounded MT Bold",
        "Malgun Gothic",
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 20%,
            #fff8df,
            #f5d5a3 45%,
            #795777 100%
        );

    color: #382438;
}

/* ==============================
   게임 전체
============================== */

.game {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 16px;
}

.game-box {
    position: relative;

    width: min(1100px, 100%);
    min-height: min(850px, calc(100vh - 32px));

    overflow: hidden;

    border: 7px solid #402d47;
    border-radius: 30px;

    background:
        linear-gradient(
            rgba(255,255,255,.94),
            rgba(255,235,203,.95)
        );

    box-shadow:
        0 18px 45px rgba(30,15,35,.35);
}

/* ==============================
   오페라 극장
============================== */

.theater {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.ceiling {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 120px;

    background:
        radial-gradient(
            ellipse at center,
            #fff0a8 0 7%,
            transparent 8%
        ),
        linear-gradient(
            #62436a,
            #302039
        );
}

.chandelier {
    position: absolute;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    width: 100px;
    height: 70px;
}

.chandelier::before {
    content: "";

    position: absolute;

    left: 48px;
    top: 0;

    width: 4px;
    height: 30px;

    background: #e7c76d;
}

.chandelier::after {
    content: "✦  ✦  ✦";

    position: absolute;

    left: 0;
    top: 25px;

    width: 100px;

    text-align: center;

    color: #ffe99a;

    font-size: 25px;

    text-shadow:
        0 0 12px #fff2a8;
}

.curtain {
    position: absolute;

    top: 85px;
    bottom: 0;

    width: 18%;

    background:
        repeating-linear-gradient(
            90deg,
            #681c36 0,
            #a72f4e 22px,
            #64192f 44px
        );

    box-shadow:
        inset -12px 0 18px rgba(0,0,0,.25);
}

.curtain.left {
    left: 0;

    border-radius:
        0 0 80% 0;
}

.curtain.right {
    right: 0;

    transform: scaleX(-1);

    border-radius:
        0 0 80% 0;
}

.columns {
    position: absolute;

    top: 115px;
    bottom: 32%;

    left: 19%;
    right: 19%;

    display: flex;
    justify-content: space-between;
}

.column {
    width: 25px;

    border-radius:
        15px 15px 5px 5px;

    background:
        linear-gradient(
            90deg,
            #a7783e,
            #f3d594,
            #a7783e
        );

    box-shadow:
        4px 0 7px rgba(0,0,0,.2);
}

.stage {
    position: absolute;

    left: 5%;
    right: 5%;
    bottom: 0;

    height: 45%;

    border-radius:
        50% 50% 0 0;

    background:
        radial-gradient(
            ellipse at center top,
            #b83e5a,
            #79263f 55%,
            #461c31
        );

    box-shadow:
        inset 0 15px 30px rgba(255,255,255,.15);
}

/* ==============================
   상단
============================== */

.header {
    position: relative;
    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding:
        22px
        clamp(14px, 4vw, 45px)
        8px;
}

.title {
    margin: 0;

    color: #5c294d;

    font-size:
        clamp(24px, 4vw, 46px);

    line-height: 1.08;

    text-shadow:
        2px 3px 0 #fff;

    word-break: keep-all;
}

.score-box {
    flex-shrink: 0;

    padding:
        9px 17px;

    border-radius: 20px;

    background: white;

    border: 4px solid #e4a84f;

    color: #71344d;

    font-size:
        clamp(15px, 2.5vw, 24px);

    font-weight: 900;

    white-space: nowrap;
}

/* ==============================
   문제
============================== */

.quiz-area {
    position: relative;
    z-index: 10;

    width: min(920px, 94%);

    margin: 0 auto;
}

.quiz-title {
    margin:
        5px 0 2px;

    text-align: center;

    color: #63334f;

    font-size:
        clamp(19px, 3vw, 30px);

    font-weight: 900;

    word-break: keep-all;
}

.staff-wrap {
    width: 100%;
}

.staff-svg {
    display: block;

    width: 100%;
    height: auto;

    overflow: visible;
}

.staff-line {
    stroke: #201a20;
    stroke-width: 4;
    stroke-linecap: round;
}

.question-note {
    fill: #fff;

    stroke: #111;

    stroke-width: 5;
}

.ledger-line {
    stroke: #111;

    stroke-width: 4;

    stroke-linecap: round;
}

/* ==============================
   달리기 영역
============================== */

.runway {
    position: relative;

    width: 94%;
    max-width: 920px;

    height:
        clamp(120px, 18vw, 185px);

    margin:
        5px auto 0;

    overflow: hidden;

    border-radius: 25px;
}

.runway::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 17px;

    height: 7px;

    border-radius: 10px;

    background:
        repeating-linear-gradient(
            90deg,
            #f6d47a 0 45px,
            transparent 45px 75px
        );

    opacity: .8;
}

/* ==============================
   하트
============================== */

.heart-runner {
    position: absolute;

    left: 10%;
    bottom: 27px;

    width:
        clamp(62px, 10vw, 95px);

    height:
        clamp(62px, 10vw, 95px);

    z-index: 10;

    transition:
        left .5s ease;
}

.heart-body {
    width: 100%;
    height: 100%;
}

.heart-shape {
    fill: #ff668c;

    stroke: #8d2c52;

    stroke-width: 4;

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.2)
        );
}

.eye {
    fill: #482236;
}

.blush {
    fill: #ff9db2;
    opacity: .8;
}

.hat {
    fill: #46304f;

    stroke: #24192b;

    stroke-width: 3;
}

.hat-band {
    fill: #e9ba52;
}

/* ==============================
   마녀
============================== */

.witch {
    position: absolute;

    right: 10%;
    bottom: 25px;

    width:
        clamp(70px, 11vw, 110px);

    height:
        clamp(95px, 15vw, 145px);

    z-index: 9;
}

.witch-svg {
    width: 100%;
    height: 100%;
}

.witch-body {
    fill: #4e315f;

    stroke: #291b35;

    stroke-width: 3;
}

.witch-face {
    fill: #f4c89f;

    stroke: #7e4b42;

    stroke-width: 3;
}

.witch-hair {
    fill: #302039;
}

.witch-hat {
    fill: #32203e;

    stroke: #20152a;

    stroke-width: 3;
}

.witch-hat-band {
    fill: #d44e71;
}

.witch-eye {
    fill: #241729;
}

.wand {
    stroke: #6c4329;

    stroke-width: 6;

    stroke-linecap: round;
}

.magic {
    fill: #ffe26e;

    stroke: #ff9e42;

    stroke-width: 2;
}

/* ==============================
   답 버튼
============================== */

.answers {
    position: relative;

    z-index: 20;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    width: min(850px, 92%);

    margin:
        5px auto 20px;
}

.answer {
    min-height: 58px;

    border:
        4px solid #784064;

    border-radius: 18px;

    background: #fffaf0;

    color: #542d4b;

    font-family: inherit;

    font-size:
        clamp(18px, 3vw, 27px);

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 5px 0 #a86b7e;
}

.answer:active {
    transform: translateY(3px);

    box-shadow:
        0 2px 0 #a86b7e;
}

.answer.correct {
    background: #baf3c0;

    border-color: #398b4d;
}

.answer.wrong {
    background: #ffb6b6;

    border-color: #b33232;
}

/* ==============================
   메시지
============================== */

.message {
    position: absolute;

    z-index: 50;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.7);

    opacity: 0;

    width: min(90%, 700px);

    padding:
        14px 20px;

    border-radius: 25px;

    background:
        rgba(255,255,255,.96);

    border:
        5px solid #e4a84f;

    text-align: center;

    font-size:
        clamp(20px, 5vw, 38px);

    font-weight: 900;

    line-height: 1.3;

    pointer-events: none;

    word-break: keep-all;
}

.message.show {
    animation:
        messagePop .9s ease forwards;
}

@keyframes messagePop {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.7);
    }

    45% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/* ==============================
   오버레이
============================== */

.overlay {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 18px;

    background:
        rgba(46,25,49,.84);
}

.overlay.hidden {
    display: none;
}

.overlay-card {
    width: min(650px, 94%);

    padding:
        clamp(22px, 6vw, 50px);

    border-radius: 32px;

    background:
        linear-gradient(
            145deg,
            #fffdf4,
            #ffe3ed
        );

    border:
        6px solid #e4a84f;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}

.overlay-card h2 {
    margin-top: 0;

    color: #6c3155;

    font-size:
        clamp(30px, 7vw, 58px);

    line-height: 1.15;

    word-break: keep-all;
}

.overlay-card p {
    font-size:
        clamp(16px, 3vw, 24px);

    line-height: 1.6;

    word-break: keep-all;
}

.start-btn {
    border: none;

    padding:
        14px 30px;

    border-radius: 22px;

    background: #ef668c;

    color: white;

    font-family: inherit;

    font-size:
        clamp(19px, 4vw, 30px);

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 7px 0 #9c3f60;
}

.start-btn:active {
    transform:
        translateY(4px);

    box-shadow:
        0 3px 0 #9c3f60;
}

/* ==============================
   성공
============================== */

.success-heart {
    width:
        clamp(120px, 30vw, 210px);

    margin:
        0 auto 10px;

    animation:
        successBounce 1s
        infinite alternate
        ease-in-out;
}

@keyframes successBounce {

    from {
        transform:
            scale(1)
            rotate(-4deg);
    }

    to {
        transform:
            scale(1.1)
            rotate(4deg);
    }
}

/* ==============================
   복습
============================== */

.study-card {
    width: min(900px, 96%);

    max-height: 92vh;

    overflow: auto;

    padding:
        clamp(14px, 4vw, 35px);

    border-radius: 30px;

    background: #fffdf7;

    border:
        6px solid #d69d43;

    text-align: center;
}

.study-card h2 {
    margin: 0;

    color: #683552;

    font-size:
        clamp(26px, 6vw, 45px);
}

.study-card p {
    font-size:
        clamp(14px, 3vw, 21px);

    line-height: 1.5;
}

.study-svg {
    display: block;

    width: 100%;

    height: auto;

    margin: 5px auto;
}

/* ==============================
   공격 / 충돌
============================== */

.heart-attack {
    animation:
        heartAttack .8s
        cubic-bezier(.2,.9,.3,1)
        forwards;
}

@keyframes heartAttack {

    0% {
        transform:
            translateX(0)
            scale(1);
    }

    35% {
        transform:
            translateX(100px)
            scale(1.12);
    }

    70% {
        transform:
            translateX(220px)
            scale(1.2)
            rotate(8deg);
    }

    100% {
        transform:
            translateX(275px)
            scale(.95)
            rotate(-8deg);
    }
}

.witch.defeated {
    animation:
        witchDefeated .9s ease
        forwards;
}

@keyframes witchDefeated {

    0% {
        transform:
            translateX(0)
            rotate(0)
            scale(1);

        opacity: 1;
    }

    40% {
        transform:
            translateX(30px)
            rotate(20deg)
            scale(1.1);
    }

    100% {
        transform:
            translateX(160px)
            translateY(-60px)
            rotate(45deg)
            scale(.35);

        opacity: 0;
    }
}

.witch.crash {
    animation:
        witchCrash .8s
        cubic-bezier(.4,0,.2,1)
        forwards;
}

@keyframes witchCrash {

    0% {
        transform:
            translateX(0)
            rotate(0);
    }

    60% {
        transform:
            translateX(-220px)
            rotate(-8deg);
    }

    100% {
        transform:
            translateX(-245px)
            rotate(8deg);
    }
}

.crash-flash,
.victory-flash {
    position: absolute;

    inset: 0;

    z-index: 55;

    pointer-events: none;

    opacity: 0;
}

.crash-flash {
    background:
        rgba(255,255,255,.75);
}

.victory-flash {
    background:
        radial-gradient(
            circle,
            rgba(255,239,125,.7),
            transparent 60%
        );
}

.crash-flash.show,
.victory-flash.show {
    animation:
        flash .7s ease;
}

@keyframes flash {

    0% {
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* ==============================
   모바일 최소 보정
============================== */

@media (max-width: 650px) {

    .game {
        padding: 0;
    }

    .game-box {
        width: 100%;
        min-height: 100vh;

        border:
            0;

        border-radius: 0;
    }

    .header {
        padding:
            14px 12px 5px;

        gap: 8px;
    }

    .title {
        font-size:
            clamp(20px, 6vw, 31px);
    }

    .score-box {
        padding:
            7px 10px;

        border-width: 3px;

        font-size:
            clamp(13px, 3.8vw, 19px);
    }

    .quiz-area {
        width: 96%;
    }

    .quiz-title {
        font-size:
            clamp(17px, 4.8vw, 25px);
    }

    .runway {
        width: 96%;

        height:
            clamp(115px, 28vw, 155px);
    }

    .heart-runner {
        left: 6%;
        bottom: 22px;
    }

    .witch {
        right: 5%;
        bottom: 22px;
    }

    .answers {
        width: 94%;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 9px;

        margin-bottom: 12px;
    }

    .answer {
        min-height: 50px;

        border-width: 3px;

        border-radius: 15px;

        font-size:
            clamp(16px, 4.5vw, 23px);
    }

    .stage {
        height: 40%;
    }

    .curtain {
        width: 13%;
    }

    .columns {
        left: 15%;
        right: 15%;
    }

    .column {
        width: 17px;
    }

    .message {
        width: 88%;

        font-size:
            clamp(20px, 6vw, 31px);
    }
}

/* 작은 휴대폰 */
@media (max-width: 380px) {

    .title {
        font-size: 19px;
    }

    .score-box {
        padding:
            6px 8px;

        font-size: 13px;
    }

    .quiz-title {
        font-size: 17px;
    }

    .answer {
        min-height: 47px;

        font-size: 16px;
    }
}
</style>
</head>


<body>

<div class="game">

<div class="game-box">

<!-- ==========================
     오페라 극장
========================== -->

<div class="theater">

    <div class="ceiling"></div>

    <div class="chandelier"></div>

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div class="columns">
        <div class="column"></div>
        <div class="column"></div>
    </div>

    <div class="stage"></div>

</div>


<!-- ==========================
     제목 / 점수
========================== -->

<header class="header">

    <h1 class="title">
        🎩 모자 쓴 하트의<br>
        계이름 모험
    </h1>

    <div class="score-box">
        성공
        <span id="score">0</span>
        / 5
    </div>

</header>


<!-- ==========================
     문제
========================== -->

<section class="quiz-area">

    <div class="quiz-title">
        🎼 이 음표의 계이름은?
    </div>


    <div class="staff-wrap">

        <svg
            id="quizStaff"
            class="staff-svg"
            viewBox="0 0 900 220"
            preserveAspectRatio="xMidYMid meet"
        >

            <!-- 높은음자리표 -->

            <text
                x="55"
                y="143"
                font-size="105"
                font-family="serif"
                font-weight="bold"
            >𝄞</text>


            <!-- 오선 -->

            <line
                class="staff-line"
                x1="110"
                y1="80"
                x2="850"
                y2="80"
            />

            <line
                class="staff-line"
                x1="110"
                y1="92.5"
                x2="850"
                y2="92.5"
            />

            <line
                class="staff-line"
                x1="110"
                y1="105"
                x2="850"
                y2="105"
            />

            <line
                class="staff-line"
                x1="110"
                y1="117.5"
                x2="850"
                y2="117.5"
            />

            <line
                class="staff-line"
                x1="110"
                y1="130"
                x2="850"
                y2="130"
            />


            <!-- 도의 덧줄 -->

            <line
                id="quizLedger"
                class="ledger-line"
                x1="115"
                x2="180"
                y1="165"
                y2="165"
                style="display:none"
            />


            <!-- 문제 음표 -->

            <ellipse
                id="quizNote"
                class="question-note"
                cx="150"
                cy="165"
                rx="15"
                ry="10"
            />

        </svg>

    </div>

</section>


<!-- ==========================
     달리기
========================== -->

<section class="runway">

    <!-- 하트 -->

    <div
        id="heartRunner"
        class="heart-runner"
    >

        <svg
            class="heart-body"
            viewBox="0 0 100 100"
        >

            <!-- 모자 -->

            <path
                class="hat"
                d="
                    M25 25
                    L76 25
                    L69 10
                    L34 10
                    Z
                "
            />

            <rect
                class="hat-band"
                x="28"
                y="22"
                width="44"
                height="8"
                rx="4"
            />


            <!-- 하트 -->

            <path
                class="heart-shape"
                d="
                    M50 88
                    C43 79 13 62 13 39
                    C13 25 23 18 34 18
                    C42 18 48 22 50 29
                    C52 22 58 18 66 18
                    C77 18 87 25 87 39
                    C87 62 57 79 50 88
                    Z
                "
            />


            <!-- 눈 -->

            <ellipse
                class="eye"
                cx="38"
                cy="48"
                rx="3"
                ry="4"
            />

            <ellipse
                class="eye"
                cx="62"
                cy="48"
                rx="3"
                ry="4"
            />


            <!-- 볼 -->

            <ellipse
                class="blush"
                cx="30"
                cy="58"
                rx="7"
                ry="4"
            />

            <ellipse
                class="blush"
                cx="70"
                cy="58"
                rx="7"
                ry="4"
            />


            <!-- 입 -->

            <path
                d="M45 59 Q50 64 55 59"
                fill="none"
                stroke="#6d3047"
                stroke-width="3"
                stroke-linecap="round"
            />

        </svg>

    </div>


    <!-- 마녀 -->

    <div
        id="witch"
        class="witch"
    >

        <svg
            class="witch-svg"
            viewBox="0 0 100 140"
        >

            <!-- 몸 -->

            <path
                class="witch-body"
                d="
                    M31 80
                    Q50 69 69 80
                    L79 130
                    L21 130
                    Z
                "
            />


            <!-- 얼굴 -->

            <ellipse
                class="witch-face"
                cx="50"
                cy="58"
                rx="25"
                ry="27"
            />


            <!-- 머리 -->

            <path
                class="witch-hair"
                d="
                    M23 58
                    Q19 32 50 29
                    Q81 32 77 58
                    Q69 43 50 45
                    Q31 43 23 58
                "
            />


            <!-- 모자 -->

            <path
                class="witch-hat"
                d="
                    M20 36

<script>
/* =====================================================
   계이름 데이터
===================================================== */

/*
    다장조 높은음자리표

    도       : 첫째 덧줄 아래
    레       : 오선 아래 첫째 칸
    미       : 첫째 줄
    파       : 첫째 칸
    솔       : 둘째 줄
    라       : 둘째 칸
    시       : 셋째 줄
    높은 도  : 셋째 칸
*/

const NOTES = [

    {
        name: "도",
        y: 165,
        ledger: true
    },

    {
        name: "레",
        y: 152.5,
        ledger: false
    },

    {
        name: "미",
        y: 140,
        ledger: false
    },

    {
        name: "파",
        y: 127.5,
        ledger: false
    },

    {
        name: "솔",
        y: 115,
        ledger: false
    },

    {
        name: "라",
        y: 102.5,
        ledger: false
    },

    {
        name: "시",
        y: 90,
        ledger: false
    },

    {
        name: "높은 도",
        y: 77.5,
        ledger: false
    }

];


/* =====================================================
   상태
===================================================== */

let currentNote = null;

let score = 0;

let wrongCount = 0;

let gameRunning = false;

let nextTimer = null;

let studyTimerValue = 5;

let studyTimerInterval = null;


/* =====================================================
   DOM
===================================================== */

const quizNote =
    document.getElementById(
        "quizNote"
    );

const quizLedger =
    document.getElementById(
        "quizLedger"
    );

const answers =
    document.getElementById(
        "answers"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const heartRunner =
    document.getElementById(
        "heartRunner"
    );

const witch =
    document.getElementById(
        "witch"
    );

const message =
    document.getElementById(
        "message"
    );

const crashFlash =
    document.getElementById(
        "crashFlash"
    );

const victoryFlash =
    document.getElementById(
        "victoryFlash"
    );

const startOverlay =
    document.getElementById(
        "startOverlay"
    );

const successOverlay =
    document.getElementById(
        "successOverlay"
    );

const studyOverlay =
    document.getElementById(
        "studyOverlay"
    );

const studyTimer =
    document.getElementById(
        "studyTimer"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const successRestart =
    document.getElementById(
        "successRestart"
    );


/* =====================================================
   모바일 음악
   외부 mp3 파일 필요 없음
===================================================== */

let audioContext = null;

let musicTimer = null;

let musicStarted = false;


/*
    짧고 자연스러운 피아노풍 멜로디
*/

const melody = [

    261.63,  // 도
    329.63,  // 미
    392.00,  // 솔
    329.63,  // 미

    293.66,  // 레
    349.23,  // 파
    440.00,  // 라
    349.23   // 파

];


function setupAudio() {

    if (audioContext) {
        return;
    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) {
        return;
    }

    audioContext =
        new AudioContext();
}


function playTone(
    frequency,
    duration
) {

    if (!audioContext) {
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "sine";

    oscillator.frequency.value =
        frequency;

    oscillator.connect(
        gain
    );

    gain.connect(
        audioContext.destination
    );

    const now =
        audioContext.currentTime;


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.075,
        now + 0.035
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now + duration + 0.03
    );
}


async function startMusic() {

    setupAudio();

    if (!audioContext) {
        return;
    }


    /*
        휴대폰에서
        사용자 터치 이후 suspended 상태 해제
    */

    if (
        audioContext.state ===
        "suspended"
    ) {

        try {

            await audioContext.resume();

        } catch (error) {

            console.log(
                "Audio resume error:",
                error
            );

            return;
        }
    }


    if (musicStarted) {
        return;
    }


    musicStarted = true;


    let index = 0;


    function playNext() {

        if (!musicStarted) {
            return;
        }


        playTone(
            melody[index],
            0.48
        );


        index =
            (index + 1)
            % melody.length;


        musicTimer =
            setTimeout(
                playNext,
                570
            );
    }


    playNext();
}


function stopMusic() {

    musicStarted = false;


    if (musicTimer) {

        clearTimeout(
            musicTimer
        );

        musicTimer = null;
    }
}


/* =====================================================
   게임 시작
===================================================== */

async function startGame() {

    /*
        반드시 사용자의 버튼 터치에서
        음악을 활성화
    */

    await startMusic();


    score = 0;

    wrongCount = 0;

    scoreText.textContent =
        "0";

    gameRunning = true;


    startOverlay.classList.add(
        "hidden"
    );

    successOverlay.classList.add(
        "hidden"
    );

    studyOverlay.classList.add(
        "hidden"
    );


    resetCharacters();

    makeQuestion();
}


/* =====================================================
   다시 시작
===================================================== */

function restartGame() {

    stopMusic();

    score = 0;

    wrongCount = 0;

    scoreText.textContent =
        "0";

    gameRunning = false;


    successOverlay.classList.add(
        "hidden"
    );

    studyOverlay.classList.add(
        "hidden"
    );

    startOverlay.classList.remove(
        "hidden"
    );


    resetCharacters();
}


/* =====================================================
   문제 출제
===================================================== */

function makeQuestion() {

    if (!gameRunning) {
        return;
    }


    currentNote =
        NOTES[
            Math.floor(
                Math.random()
                * NOTES.length
            )
        ];


    /*
        정확한 음표 위치
    */

    quizNote.setAttribute(
        "cy",
        currentNote.y
    );


    /*
        도일 경우 덧줄 표시
    */

    if (
        currentNote.ledger
    ) {

        quizLedger.style.display =
            "block";

        quizLedger.setAttribute(
            "y1",
            currentNote.y
        );

        quizLedger.setAttribute(
            "y2",
            currentNote.y
        );

    } else {

        quizLedger.style.display =
            "none";
    }


    createAnswers();
}


/* =====================================================
   보기 생성
===================================================== */

function createAnswers() {

    answers.innerHTML = "";


    const choices = [
        currentNote.name
    ];


    while (
        choices.length < 4
    ) {

        const random =
            NOTES[
                Math.floor(
                    Math.random()
                    * NOTES.length
                )
            ];


        if (
            !choices.includes(
                random.name
            )
        ) {

            choices.push(
                random.name
            );
        }
    }


    /*
        보기 섞기
    */

    for (
        let i =
            choices.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random()
                * (i + 1)
            );


        [
            choices[i],
            choices[j]
        ] =
        [
            choices[j],
            choices[i]
        ];
    }


    choices.forEach(
        choice => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.textContent =
                choice;


            button.addEventListener(
                "click",
                () => {

                    checkAnswer(
                        choice,
                        button
                    );

                }
            );


            answers.appendChild(
                button
            );

        }
    );
}


/* =====================================================
   정답 확인
===================================================== */

function checkAnswer(
    answer,
    button
) {

    if (!gameRunning) {
        return;
    }


    /*
        중복 클릭 방지
    */

    document
        .querySelectorAll(
            ".answer"
        )
        .forEach(
            item => {

                item.disabled =
                    true;
            }
        );


    if (
        answer ===
        currentNote.name
    ) {

        button.classList.add(
            "correct"
        );

        correctAnswer();

    } else {

        button.classList.add(
            "wrong"
        );

        wrongAnswer();
    }
}


/* =====================================================
   정답
===================================================== */

function correctAnswer() {

    score++;


    scoreText.textContent =
        score;


    showMessage(
        "정답! 마녀를 물리쳤어요! ⚡"
    );


    /*
        하트 공격
    */

    heartRunner.classList.remove(
        "heart-attack"
    );

    void heartRunner.offsetWidth;

    heartRunner.classList.add(
        "heart-attack"
    );


    /*
        마녀 패배
    */

    witch.classList.remove(
        "crash"
    );

    witch.classList.remove(
        "defeated"
    );

    void witch.offsetWidth;

    witch.classList.add(
        "defeated"
    );


    victoryFlash.classList.remove(
        "show"
    );

    void victoryFlash.offsetWidth;

    victoryFlash.classList.add(
        "show"
    );


    /*
        5회 성공
    */

    if (
        score >= 5
    ) {

        gameRunning = false;

        stopMusic();


        setTimeout(
            () => {

                successOverlay.classList.remove(
                    "hidden"
                );

            },
            900
        );


        return;
    }


    /*
        다음 문제
    */

    nextTimer =
        setTimeout(
            () => {

                resetCharacters();

                makeQuestion();

            },
            1050
        );
}


/* =====================================================
   오답
===================================================== */

function wrongAnswer() {

    wrongCount++;


    /*
        마녀 돌진
    */

    witch.classList.remove(
        "defeated"
    );

    witch.classList.remove(
        "crash"
    );

    void witch.offsetWidth;

    witch.classList.add(
        "crash"
    );


    /*
        충돌
    */

    setTimeout(
        () => {

            crashFlash.classList.remove(
                "show"
            );

            void crashFlash.offsetWidth;

            crashFlash.classList.add(
                "show"
            );


            showMessage(
                "꽝! 마녀와 충돌했어요! 💥"
            );

        },
        600
    );


    /*
        3회 오답이면 복습
    */

    if (
        wrongCount >= 3
    ) {

        gameRunning = false;

        stopMusic();


        setTimeout(
            () => {

                showStudyScreen();

            },
            1450
        );


        return;
    }


    /*
        다음 문제
    */

    nextTimer =
        setTimeout(
            () => {

                resetCharacters();

                makeQuestion();

            },
            1450
        );
}


/* =====================================================
   캐릭터 초기화
===================================================== */

function resetCharacters() {

    witch.classList.remove(
        "crash"
    );

    witch.classList.remove(
        "defeated"
    );

    heartRunner.classList.remove(
        "heart-attack"
    );

    crashFlash.classList.remove(
        "show"
    );

    victoryFlash.classList.remove(
        "show"
    );
}


/* =====================================================
   메시지
===================================================== */

function showMessage(text) {

    message.textContent =
        text;


    message.classList.remove(
        "show"
    );


    void message.offsetWidth;


    message.classList.add(
        "show"
    );
}


/* =====================================================
   복습 화면
===================================================== */

function showStudyScreen() {

    studyOverlay.classList.remove(
        "hidden"
    );


    studyTimerValue = 5;


    studyTimer.textContent =
        "5초 후 다시 시작합니다.";


    clearInterval(
        studyTimerInterval
    );


    studyTimerInterval =
        setInterval(
            () => {

                studyTimerValue--;


                if (
                    studyTimerValue <= 0
                ) {

                    clearInterval(
                        studyTimerInterval
                    );


                    studyOverlay.classList.add(
                        "hidden"
                    );


                    wrongCount = 0;

                    score = 0;


                    scoreText.textContent =
                        "0";


                    resetCharacters();


                    gameRunning = true;


                    /*
                        복습 화면이 끝난 뒤에도
                        다시 음악 시작
                    */

                    startMusic();


                    makeQuestion();


                    return;
                }


                studyTimer.textContent =
                    studyTimerValue +
                    "초 후 다시 시작합니다.";

            },
            1000
        );
}


/* =====================================================
   버튼
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);


successRestart.addEventListener(
    "click",
    startGame
);


/*
    모바일 터치에서 AudioContext가
    확실하게 활성화되도록 준비
*/

startButton.addEventListener(
    "touchstart",
    () => {

        setupAudio();

        if (
            audioContext &&
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

    },
    {
        passive: true
    }
);


/* =====================================================
   초기 화면
===================================================== */

startOverlay.classList.remove(
    "hidden"
);

successOverlay.classList.add(
    "hidden"
);

studyOverlay.classList.add(
    "hidden"
);

</script>
